<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPad ハンドメッシュ ＆ リアルタイム配信</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* カメラ・描画用ステージ */
    #stage {
      position: relative;
      width: 800px;
      height: 600px;
      max-width: 95vw;
      max-height: 70vh;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 鏡合わせ表示 */
    }

    /* UIパネル */
    #control-panel {
      margin-top: 15px;
      background: rgba(22, 27, 34, 0.9);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid #30363d;
      text-align: center;
      z-index: 20;
    }

    input, button {
      padding: 8px 12px;
      font-size: 15px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    input { background: #161b22; color: #fff; width: 120px; text-align: center; }
    button { background: #238636; color: white; cursor: pointer; border: none; font-weight: bold; }
    button:hover { background: #2ea043; }
    .status { margin-bottom: 6px; font-weight: bold; color: #58a6ff; font-size: 14px; }
  </style>

  <!-- MediaPipe Hands ＆ PeerJS -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>🖐️ リアルタイム・ハンドメッシュ ビューワー</h2>

  <div id="stage">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div id="control-panel">
    <div id="status" class="status">通信初期化中...</div>
    <div id="connection-ui" style="margin-top: 8px;">
      ID: <span id="my-id" style="color: #f2e05a; font-weight: bold;">----</span>
      <input type="text" id="target-id" placeholder="相手のID">
      <button onclick="connectToPeer()">iPadから接続</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');

    let peer = null;
    let dataConnection = null;

    // 手の関節（21箇所のポイント）の接続定義 (ワイヤーフレームメッシュ)
    const HAND_CONNECTIONS = [
      // 親指
      [0, 1], [1, 2], [2, 3], [3, 4],
      // 人差し指
      [0, 5], [5, 6], [6, 7], [7, 8],
      // 中指
      [9, 10], [10, 11], [11, 12],
      // 薬指
      [13, 14], [14, 15], [15, 16],
      // 小指
      [0, 17], [17, 18], [18, 19], [19, 20],
      // 手のひら・指根の横接続メッシュ
      [5, 9], [9, 13], [13, 17], [0, 5]
    ];

    // --- PeerJS (WebRTC通信) ---
    const customId = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer(customId);

    peer.on('open', (id) => {
      myIdSpan.innerText = id;
      statusText.innerText = "Windows側はこのIDをiPadに入力して待機してください";
    });

    peer.on('connection', (conn) => {
      dataConnection = conn;
      setupDataReceiver();
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        videoElement.srcObject = remoteStream;
        statusText.innerText = "iPadからの映像受信中！ハンドメッシュ描画中";
      });
    });

    function connectToPeer() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert("接続先のIDを入力してください");

      statusText.innerText = "接続中...";
      dataConnection = peer.connect(targetId);
      dataConnection.on('open', () => {
        statusText.innerText = "接続成功！手トラッキングを開始します";
        initHandTracking(true, targetId);
      });
    }

    // Windows側（データ受信）：iPadから送られたハンドランドマーク（座標データ）でメッシュを描画
    function setupDataReceiver() {
      dataConnection.on('data', (data) => {
        if (data.type === 'hand_mesh') {
          drawHandMesh(data.landmarks);
        }
      });
    }

    // --- MediaPipe Hands (手のメッシュ認識) ---
    function initHandTracking(isCameraOwner, targetId = null) {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2, // 最大2つの手をトラッキング
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        canvasElement.width = videoElement.videoWidth || 800;
        canvasElement.height = videoElement.videoHeight || 600;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const allLandmarks = [];

          for (const landmarks of results.multiHandLandmarks) {
            // メッシュ描画
            renderMeshOnCanvas(landmarks);

            // Windows送信用に正規化座標(0~1)を記録
            allLandmarks.push(landmarks);
          }

          // データ通信でWindows側へ関節座標を送信
          if (dataConnection && dataConnection.open) {
            dataConnection.send({
              type: 'hand_mesh',
              landmarks: allLandmarks
            });
          }

          statusText.innerText = `手を検出中 (${results.multiHandLandmarks.length}つの手)`;
        } else {
          statusText.innerText = "カメラに手をかざしてください";
        }
        canvasCtx.restore();
      });

      if (isCameraOwner) {
        const camera = new Camera(videoElement, {
          onFrame: async () => {
            if (videoElement.readyState >= 2) {
              await hands.send({ image: videoElement });
            }
          },
          width: 640,
          height: 480,
          facingMode: 'user'
        });

        camera.start().then(() => {
          const stream = videoElement.srcObject;
          peer.call(targetId, stream);
          statusText.innerText = "配信中！カメラに手を向けて操作してください";
        });
      }
    }

    // Windows側で受信データからハンドメッシュを描画
    function drawHandMesh(allHandLandmarks) {
      canvasElement.width = videoElement.videoWidth || 800;
      canvasElement.height = videoElement.videoHeight || 600;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (allHandLandmarks) {
        for (const landmarks of allHandLandmarks) {
          renderMeshOnCanvas(landmarks);
        }
      }
      canvasCtx.restore();
    }

    // 画面上に手構造のワイヤーフレーム＆ジョイントを描画する関数
    function renderMeshOnCanvas(landmarks) {
      const w = canvasElement.width;
      const h = canvasElement.height;

      // 1. ワイヤーフレーム（メッシュ線）の描画
      canvasCtx.strokeStyle = '#00ffcc'; // メッシュ線の色（シアン/ネオンブルー）
      canvasCtx.lineWidth = 2;

      for (const edge of HAND_CONNECTIONS) {
        const p1 = landmarks[edge[0]];
        const p2 = landmarks[edge[1]];

        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * w, p1.y * h);
        canvasCtx.lineTo(p2.x * w, p2.y * h);
        canvasCtx.stroke();
      }

      // 2. 関節（ジョイントノード）の点描画
      for (let i = 0; i < landmarks.length; i++) {
        const pt = landmarks[i];
        const x = pt.x * w;
        const y = pt.y * h;

        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 4, 0, 2 * Math.PI);

        // 指先（4, 8, 12, 16, 20）は別の色で強調
        if ([4, 8, 12, 16, 20].includes(i)) {
          canvasCtx.fillStyle = '#ff0055'; // 指先: マゼンタ
        } else {
          canvasCtx.fillStyle = '#ffffff'; // ノード: 白
        }

        canvasCtx.fill();
        canvasCtx.strokeStyle = '#000000';
        canvasCtx.lineWidth = 1;
        canvasCtx.stroke();
      }
    }
  </script>
</body>
</html>
