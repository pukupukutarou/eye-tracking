<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Face Camera</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #111;

    color: white;

    font-family: Arial, sans-serif;

}

body {

    display: flex;

    justify-content: center;
    align-items: center;

}

#app {

    width: 100%;
    max-width: 900px;

    padding: 20px;

}

h1 {

    font-size: 22px;

    margin: 0 0 15px 0;

}

.panel {

    background: #222;

    border-radius: 14px;

    padding: 18px;

    margin-bottom: 15px;

}

/* =========================================================
   Video
   ========================================================= */

#videoContainer {

    position: relative;

    width: 100%;

    background: #000;

    border-radius: 12px;

    overflow: hidden;

    line-height: 0;

}

video {

    display: block;

    width: 100%;

    height: auto;

    max-height: 70vh;

    object-fit: contain;

    background: #000;

    border: 0;

    outline: none;

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;

}

/* Chrome / Edge / Safari */

video::-webkit-media-controls {

    display: none !important;

}

video::-webkit-media-controls-enclosure {

    display: none !important;

}

video::-webkit-media-controls-panel {

    display: none !important;

}

video::-webkit-media-controls-play-button {

    display: none !important;

}

video::-webkit-media-controls-timeline {

    display: none !important;

}

video::-webkit-media-controls-current-time-display {

    display: none !important;

}

video::-webkit-media-controls-time-remaining-display {

    display: none !important;

}

video::-webkit-media-controls-mute-button {

    display: none !important;

}

video::-webkit-media-controls-volume-slider {

    display: none !important;

}

video::-webkit-media-controls-fullscreen-button {

    display: none !important;

}


/* =========================================================
   Input
   ========================================================= */

input {

    width: 150px;

    padding: 12px;

    font-size: 18px;

    text-align: center;

    letter-spacing: 5px;

    border: none;

    border-radius: 8px;

    outline: none;

}

button {

    padding: 12px 18px;

    margin-left: 8px;

    font-size: 18px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

}

button:active {

    transform: scale(0.98);

}


/* =========================================================
   Status
   ========================================================= */

#status {

    margin-top: 14px;

    color: #aaa;

    white-space: pre-wrap;

    line-height: 1.5;

}

#faceInfo {

    margin-top: 10px;

    color: #7cff9a;

    font-family: monospace;

    font-size: 14px;

}


/* =========================================================
   Windows mode
   ========================================================= */

.windowsMode #videoContainer {

    border-radius: 0;

}


/* =========================================================
   Hidden
   ========================================================= */

.hidden {

    display: none !important;

}

</style>

</head>


<body>

<div id="app">

    <h1>
        iPad Camera → Face Tracking
    </h1>


    <div class="panel">

        <div>

            <label>
                4桁PIN
            </label>

            <br>
            <br>

            <input
                id="pin"
                maxlength="4"
                inputmode="numeric"
                autocomplete="off"
                placeholder="1234"
            >

            <button id="startButton">
                開始
            </button>

        </div>


        <div id="status">
            待機中
        </div>


        <div id="faceInfo">
            Face: -
        </div>

    </div>


    <div
        id="videoContainer"
        class="panel"
    >

        <video
            id="video"
            autoplay
            playsinline
            muted
            disablePictureInPicture
            controlsList="nodownload noplaybackrate nofullscreen"
        ></video>

    </div>


    <canvas
        id="faceCanvas"
        class="hidden"
    ></canvas>

</div>


<script type="module">

// ============================================================
// MediaPipe
// ============================================================

import {

    FaceLandmarker,
    FilesetResolver

}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


// ============================================================
// DOM
// ============================================================

const pinInput =
    document.getElementById("pin");

const startButton =
    document.getElementById("startButton");

const statusElement =
    document.getElementById("status");

const faceInfo =
    document.getElementById("faceInfo");

const video =
    document.getElementById("video");


// ============================================================
// State
// ============================================================

let peer = null;

let dataConnection = null;

let mediaCall = null;

let localStream = null;

let faceLandmarker = null;

let lastVideoTime = -1;

let lastSendTime = 0;

let faceReady = false;

let pythonSocket = null;


// ============================================================
// Settings
// ============================================================

const MIRROR_FACE_X = true;

const SEND_INTERVAL = 33;


// ============================================================
// Status
// ============================================================

function setStatus(text) {

    statusElement.textContent = text;

    console.log(text);

}


// ============================================================
// PIN
// ============================================================

function getPin() {

    const pin =
        pinInput.value.trim();

    if (!/^\d{4}$/.test(pin)) {

        alert(
            "4桁のPINを入力してください"
        );

        return null;

    }

    return pin;

}


// ============================================================
// Peer ID
// ============================================================

function cameraPeerId(pin) {

    return "face-camera-" + pin;

}


// ============================================================
// MediaPipe
// ============================================================

async function createFaceLandmarker() {

    setStatus(
        "顔認識AIを読み込み中..."
    );


    const vision =
        await FilesetResolver.forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

        );


    faceLandmarker =
        await FaceLandmarker.createFromOptions(

            vision,

            {

                baseOptions: {

                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

                },

                runningMode:
                    "VIDEO",

                numFaces:
                    1,

                minFaceDetectionConfidence:
                    0.5,

                minFacePresenceConfidence:
                    0.5,

                minTrackingConfidence:
                    0.5,

                outputFaceBlendshapes:
                    false,

                outputFacialTransformationMatrixes:
                    true

            }

        );


    faceReady = true;


    console.log(
        "Face Landmarker ready"
    );

}


// ============================================================
// Camera
// ============================================================

async function startCamera() {

    setStatus(
        "カメラを起動中..."
    );


    localStream =
        await navigator.mediaDevices.getUserMedia(

            {

                video: {

                    facingMode:
                        "user",

                    width: {

                        ideal:
                            1280

                    },

                    height: {

                        ideal:
                            720

                    },

                    frameRate: {

                        ideal:
                            30

                    }

                },

                audio:
                    false

            }

        );


    video.srcObject =
        localStream;


    await video.play();


    setStatus(
        "カメラ起動完了"
    );

}


// ============================================================
// Python WebSocket
// ============================================================

function connectPython() {

    if (pythonSocket) {

        try {

            pythonSocket.close();

        } catch {}

    }


    console.log(
        "Pythonへ接続..."
    );


    try {

        pythonSocket =
            new WebSocket(
                "ws://127.0.0.1:8765"
            );

    }

    catch (error) {

        console.error(error);

        return;

    }


    pythonSocket.onopen =
        () => {

            console.log(
                "Python WebSocket connected"
            );

        };


    pythonSocket.onclose =
        () => {

            console.log(
                "Python WebSocket closed"
            );

            setTimeout(
                connectPython,
                1000
            );

        };


    pythonSocket.onerror =
        error => {

            console.error(
                "Python WebSocket error",
                error
            );

        };

}


// ============================================================
// Python送信
// ============================================================

function sendToPython(data) {

    if (!pythonSocket) {
        return;
    }


    if (
        pythonSocket.readyState !==
        WebSocket.OPEN
    ) {

        return;

    }


    try {

        pythonSocket.send(
            JSON.stringify(data)
        );

    }

    catch (error) {

        console.error(
            error
        );

    }

}


// ============================================================
// Face tracking
// ============================================================

function processFace(timestamp) {

    requestAnimationFrame(
        processFace
    );


    if (!faceReady) {
        return;
    }


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return;

    }


    if (
        video.currentTime ===
        lastVideoTime
    ) {

        return;

    }


    lastVideoTime =
        video.currentTime;


    let result;


    try {

        result =
            faceLandmarker.detectForVideo(
                video,
                timestamp
            );

    }

    catch (error) {

        console.error(
            error
        );

        return;

    }


    if (
        !result ||
        !result.faceLandmarks ||
        result.faceLandmarks.length === 0
    ) {

        return;

    }


    const lm =
        result.faceLandmarks[0];


    // --------------------------------------------------------
    // Face landmarks
    // --------------------------------------------------------

    const nose =
        lm[1];

    const forehead =
        lm[10];

    const leftEye =
        lm[33];

    const chin =
        lm[152];

    const rightEye =
        lm[263];


    // --------------------------------------------------------
    // 顔中心
    // --------------------------------------------------------

    const eyeCenterX =
        (
            leftEye.x +
            rightEye.x
        ) / 2;


    const eyeCenterY =
        (
            leftEye.y +
            rightEye.y
        ) / 2;


    // --------------------------------------------------------
    // X / Y
    // --------------------------------------------------------

    let x =
        (
            eyeCenterX -
            0.5
        ) * 2;


    let y =
        (
            eyeCenterY -
            0.5
        ) * 2;


    if (MIRROR_FACE_X) {

        x = -x;

    }


    x =
        Math.max(
            -1,
            Math.min(
                1,
                x
            )
        );


    y =
        Math.max(
            -1,
            Math.min(
                1,
                y
            )
        );


    // --------------------------------------------------------
    // Face size
    // --------------------------------------------------------

    const faceHeight =
        Math.abs(
            chin.y -
            forehead.y
        );


    let scale =
        faceHeight /
        0.35;


    scale =
        Math.max(
            0.5,
            Math.min(
                1.8,
                scale
            )
        );


    // --------------------------------------------------------
    // Yaw
    // --------------------------------------------------------

    const eyeDistance =
        Math.abs(
            rightEye.x -
            leftEye.x
        );


    let yaw = 0;


    if (
        eyeDistance >
        0.0001
    ) {

        yaw =
            (
                nose.x -
                eyeCenterX
            )
            /
            eyeDistance;


        yaw *= 2;

    }


    yaw =
        Math.max(
            -1,
            Math.min(
                1,
                yaw
            )
        );


    // --------------------------------------------------------
    // Pitch
    // --------------------------------------------------------

    let pitch = 0;


    if (
        faceHeight >
        0.0001
    ) {

        pitch =
            (
                nose.y -
                eyeCenterY
            )
            /
            faceHeight;


        pitch -=
            0.10;


        pitch *=
            4;

    }


    pitch =
        Math.max(
            -1,
            Math.min(
                1,
                pitch
            )
        );


    // --------------------------------------------------------
    // Roll
    // --------------------------------------------------------

    let roll =
        Math.atan2(

            rightEye.y -
            leftEye.y,

            rightEye.x -
            leftEye.x

        );


    roll /=
        Math.PI;


    roll =
        Math.max(
            -1,
            Math.min(
                1,
                roll
            )
        );


    // --------------------------------------------------------
    // 送信頻度
    // --------------------------------------------------------

    const now =
        performance.now();


    if (
        now -
        lastSendTime <
        SEND_INTERVAL
    ) {

        return;

    }


    lastSendTime =
        now;


    const data = {

        type:
            "face",

        x:
            x,

        y:
            y,

        yaw:
            yaw,

        pitch:
            pitch,

        roll:
            roll,

        scale:
            scale,

        time:
            now

    };


    // --------------------------------------------------------
    // Windowsへ送信
    // --------------------------------------------------------

    if (
        dataConnection &&
        dataConnection.open
    ) {

        try {

            dataConnection.send(
                data
            );

        }

        catch (error) {

            console.error(
                error
            );

        }

    }

}


// ============================================================
// iPad
// ============================================================

async function startIPad(pin) {

    document.body.classList.remove(
        "windowsMode"
    );


    await startCamera();

    await createFaceLandmarker();


    const id =
        cameraPeerId(pin);


    setStatus(
        "iPad準備中..."
    );


    peer =
        new Peer(

            id,

            {
                debug:
                    1
            }

        );


    // --------------------------------------------------------
    // Peer Open
    // --------------------------------------------------------

    peer.on(
        "open",
        () => {

            setStatus(
                "iPadカメラ準備完了\n" +
                "Windows側を同じPINで起動してください"
            );

        }
    );


    // --------------------------------------------------------
    // WindowsからDataConnection
    // --------------------------------------------------------

    peer.on(
        "connection",
        conn => {

            console.log(
                "Face Data Connection"
            );


            dataConnection =
                conn;


            conn.on(
                "open",
                () => {

                    setStatus(
                        "Windows接続完了\n" +
                        "顔トラッキング中"
                    );

                }
            );


            conn.on(
                "close",
                () => {

                    dataConnection =
                        null;

                    setStatus(
                        "Windows切断"
                    );

                }
            );

        }
    );


    // --------------------------------------------------------
    // WindowsからVideo Call
    // --------------------------------------------------------

    peer.on(
        "call",
        call => {

            mediaCall =
                call;


            call.answer(
                localStream
            );

        }
    );


    peer.on(
        "error",
        error => {

            console.error(
                error
            );


            setStatus(
                "PeerJS ERROR\n" +
                error.type
            );

        }
    );


    requestAnimationFrame(
        processFace
    );

}


// ============================================================
// Windows
// ============================================================

async function startWindows(pin) {

    document.body.classList.add(
        "windowsMode"
    );


    // Windowsでは
    // ローカルカメラは使わない

    setStatus(
        "Windows側を起動中..."
    );


    peer =
        new Peer(

            undefined,

            {
                debug:
                    1
            }

        );


    peer.on(
        "open",
        myId => {

            console.log(
                "Windows Peer:",
                myId
            );


            const target =
                cameraPeerId(pin);


            // ------------------------------------------------
            // Face Data
            // ------------------------------------------------

            dataConnection =
                peer.connect(

                    target,

                    {

                        reliable:
                            false,

                        serialization:
                            "json",

                        label:
                            "face-tracking"

                    }

                );


            dataConnection.on(
                "open",
                () => {

                    setStatus(
                        "iPadへ接続完了\n" +
                        "顔データ待機中..."
                    );

                }
            );


            dataConnection.on(
                "data",
                data => {

                    showFaceData(
                        data
                    );


                    sendToPython(
                        data
                    );

                }
            );


            dataConnection.on(
                "error",
                error => {

                    console.error(
                        error
                    );

                }
            );


            // ------------------------------------------------
            // Video
            // ------------------------------------------------

            setStatus(
                "iPadカメラへ接続中..."
            );


            // ダミーMediaStream
            const emptyStream =
                new MediaStream();


            mediaCall =
                peer.call(

                    target,

                    emptyStream

                );


            mediaCall.on(
                "stream",
                remoteStream => {

                    console.log(
                        "iPad camera received"
                    );


                    video.srcObject =
                        remoteStream;


                    video.play();


                    setStatus(
                        "接続完了\n" +
                        "顔トラッキング中"
                    );

                }
            );


            mediaCall.on(
                "error",
                error => {

                    console.error(
                        error
                    );

                }
            );

        }
    );


    peer.on(
        "error",
        error => {

            console.error(
                error
            );


            setStatus(
                "PeerJS ERROR\n" +
                error.type
            );

        }
    );

}


// ============================================================
// Face表示
// ============================================================

function showFaceData(data) {

    faceInfo.textContent =

        "X "
        + Number(
            data.x
        ).toFixed(2)

        + "   Y "
        + Number(
            data.y
        ).toFixed(2)

        + "   Yaw "
        + Number(
            data.yaw
        ).toFixed(2)

        + "   Pitch "
        + Number(
            data.pitch
        ).toFixed(2)

        + "   Roll "
        + Number(
            data.roll
        ).toFixed(2);

}


// ============================================================
// Start
// ============================================================

startButton.addEventListener(

    "click",

    async () => {

        const pin =
            getPin();


        if (!pin) {
            return;
        }


        connectPython();


        const isIOS =

            /iPad|iPhone|iPod/i.test(
                navigator.userAgent
            )

            ||

            (
                navigator.platform ===
                "MacIntel"

                &&

                navigator.maxTouchPoints >
                1
            );


        try {

            if (isIOS) {

                await startIPad(
                    pin
                );

            }

            else {

                await startWindows(
                    pin
                );

            }

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "ERROR\n" +
                error.message
            );

        }

    }

);

</script>

</body>

</html>
