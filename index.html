<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaceMesh Camera Tracker</title>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- MediaPipe FaceMesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* 映像＋Canvasレイアウト */
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ミラー設定用クラス */
    .mirror {
      transform: scaleX(-1);
    }

    /* UI パネル */
    #ui-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.75);
      padding: 15px;
      border-radius: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 300px;
    }

    input, button {
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #555;
    }

    input {
      background: #222;
      color: #fff;
      text-align: center;
    }

    button {
      background: #4a90e2;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #357abd;
    }

    .ipad-ui { display: none; }
    body.ipad-mode .ipad-ui { display: flex; flex-direction: column; gap: 10px; }
    body.ipad-mode .pc-ui { display: none; }
  </style>
</head>
<body class="pc-mode">

  <div id="container">
    <video id="webcam" playsinline autoplay muted class="mirror"></video>
    <canvas id="mesh-canvas" class="mirror"></canvas>
  </div>

  <div id="ui-panel">
    <!-- PC用 UI -->
    <div class="pc-ui">
      <div><b>PC モード</b></div>
      <div>ID: <input type="text" id="pc-id-input" value="1234"></div>
      <button id="pc-start-btn">このIDで待機する</button>
      <div id="pc-status">IDを決めて開始してください</div>
    </div>

    <!-- iPad用 UI -->
    <div class="ipad-ui">
      <div><b>iPad モード</b></div>
      <input type="text" id="target-id-input" placeholder="PCのIDを入力" value="1234">
      <button id="connect-btn">PCに接続する</button>
      <div id="ipad-status">PCのIDを入力してください</div>
    </div>

    <!-- 共通設定: ミラー切替 -->
    <button id="toggle-mirror-btn">ミラー反転 (ON/OFF)</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isIpad = urlParams.get('role') === 'ipad';

    const videoEl = document.getElementById('webcam');
    const canvasEl = document.getElementById('mesh-canvas');
    const ctx = canvasEl.getContext('2d');
    const toggleMirrorBtn = document.getElementById('toggle-mirror-btn');

    let currentLandmarks = null;
    let isMirrored = true;

    // ミラー設定の切り替え
    toggleMirrorBtn.addEventListener('click', () => {
      isMirrored = !isMirrored;
      if (isMirrored) {
        videoEl.classList.add('mirror');
        canvasEl.classList.add('mirror');
      } else {
        videoEl.classList.remove('mirror');
        canvasEl.classList.remove('mirror');
      }
    });

    // Canvasサイズの同期
    function resizeCanvas() {
      canvasEl.width = videoEl.videoWidth || window.innerWidth;
      canvasEl.height = videoEl.videoHeight || window.innerHeight;
    }
    videoEl.addEventListener('loadedmetadata', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    // FaceMesh 描画処理
    function drawMesh(landmarks) {
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      if (!landmarks) return;

      const w = canvasEl.width;
      const h = canvasEl.height;

      // メッシュ線の描画
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 1;

      if (typeof FACEMESH_TESSELATION !== 'undefined') {
        for (const i of FACEMESH_TESSELATION) {
          const p1 = landmarks[i[0]];
          const p2 = landmarks[i[1]];
          ctx.beginPath();
          ctx.moveTo(p1.x * w, p1.y * h);
          ctx.lineTo(p2.x * w, p2.y * h);
          ctx.stroke();
        }
      } else {
        // フォールバック: 全ランドマークにドットを描画
        ctx.fillStyle = '#00ffcc';
        for (const p of landmarks) {
          ctx.beginPath();
          ctx.arc(p.x * w, p.y * h, 1.5, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }

    if (isIpad) {
      // ---------------- 【 iPad モード 】 ----------------
      document.body.className = 'ipad-mode';
      const targetIdInput = document.getElementById('target-id-input');
      const connectBtn = document.getElementById('connect-btn');
      const ipadStatus = document.getElementById('ipad-status');

      const peer = new Peer();
      let conn = null;

      // iPad 自身のカメラ起動 ＆ FaceMesh トラッキング
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

      faceMesh.onResults((results) => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const landmarks = results.multiFaceLandmarks[0];
          drawMesh(landmarks); // iPad自身の画面へ描画

          // PCへメッシュ座標データを送信
          if (conn && conn.open) {
            conn.send({ landmarks: landmarks });
          }
        }
      });

      const camera = new Camera(videoEl, {
        onFrame: async () => { await faceMesh.send({ image: videoEl }); },
        width: 1280, height: 720
      });
      camera.start();

      connectBtn.addEventListener('click', () => {
        const targetId = targetIdInput.value.trim();
        if (!targetId) return;

        ipadStatus.innerText = "接続中...";
        conn = peer.connect(targetId);

        conn.on('open', () => {
          ipadStatus.innerText = "PCに接続完了！データ送信中";
        });
        conn.on('close', () => {
          ipadStatus.innerText = "切断されました";
        });
      });

    } else {
      // ---------------- 【 PC モード 】 ----------------
      document.body.className = 'pc-mode';
      const pcIdInput = document.getElementById('pc-id-input');
      const pcStartBtn = document.getElementById('pc-start-btn');
      const pcStatus = document.getElementById('pc-status');

      // PC 自身のカメラ表示（映像のみ起動）
      navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
        .then((stream) => {
          videoEl.srcObject = stream;
        })
        .catch((err) => {
          pcStatus.innerText = "カメラ取得エラー: " + err.message;
        });

      let peer = null;

      pcStartBtn.addEventListener('click', () => {
        const customId = pcIdInput.value.trim();
        if (!customId) return;

        peer = new Peer(customId);

        peer.on('open', (id) => {
          pcStatus.innerText = `待機中 (ID: ${id})`;
        });

        peer.on('error', (err) => {
          pcStatus.innerText = "エラー: " + err.type;
        });

        // iPadから届いたメッシュデータを画面に描画
        peer.on('connection', (conn) => {
          pcStatus.innerText = "iPadと連動中！";

          conn.on('data', (data) => {
            if (data.landmarks) {
              drawMesh(data.landmarks); // iPadの顔トラッキング座標をPC映像上に描画
            }
          });
        });
      });
    }
  </script>
</body>
</html>
