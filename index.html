<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>iPad Camera → Windows</title>

<style>
* {
    box-sizing:border-box;
}

html,body {
    margin:0;
    width:100%;
    height:100%;
    background:#080808;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body {
    display:flex;
    justify-content:center;
}

.app {
    width:min(850px,100%);
    padding:20px;
}

h1 {
    margin:0 0 5px;
}

.sub {
    color:#888;
    margin-bottom:20px;
}

.panel {
    background:#151515;
    border:1px solid #292929;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
}

label {
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:7px;
}

select,
input,
button {
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #3a3a3a;
    background:#0c0c0c;
    color:#fff;
    font-size:16px;
}

input.pin {
    text-align:center;
    font-size:30px;
    letter-spacing:10px;
}

button {
    margin-top:12px;
    background:#287cff;
    border:0;
    cursor:pointer;
    font-weight:bold;
}

button.secondary {
    background:#292929;
}

button.danger {
    background:#9b2929;
}

.status {
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#0d0d0d;
    color:#aaa;
}

.status.ok {
    color:#70e090;
}

.status.error {
    color:#ff7777;
}

.video {
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:14px;
    overflow:hidden;
}

video {
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.info {
    color:#888;
    font-size:13px;
    line-height:1.7;
}

.hidden {
    display:none;
}
</style>

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

</head>

<body>

<div class="app">

<h1>📷 Camera Link</h1>

<div class="sub">
iPad → Windows
</div>


<div class="panel">

<label>この端末</label>

<select id="role">

<option value="ipad">
iPad / カメラ送信
</option>

<option value="windows">
Windows / カメラ受信
</option>

</select>

<br><br>

<label>4桁PIN</label>

<input
    id="pin"
    class="pin"
    type="password"
    inputmode="numeric"
    maxlength="4"
    placeholder="0000"
>

<button id="connect">
接続開始
</button>

<div id="status" class="status">
待機中
</div>

</div>



<!-- IPAD -->

<div id="ipadPanel" class="panel">

<h2>📱 iPad</h2>

<div class="video">

<video
    id="localVideo"
    autoplay
    muted
    playsinline>
</video>

</div>

<button id="camera">
カメラ開始
</button>

<button
    id="switchCamera"
    class="secondary">

カメラ切替

</button>

</div>



<!-- WINDOWS -->

<div id="windowsPanel" class="panel hidden">

<h2>🖥 Windows</h2>

<div class="video">

<video
    id="remoteVideo"
    autoplay
    playsinline>
</video>

</div>

<button
    id="fullscreen"
    class="secondary">

全画面

</button>

</div>



<div class="panel info">

<b>使い方</b>

<br>

① iPadでこのページを開く

<br>

② 「iPad / カメラ送信」

<br>

③ 4桁PINを入力

<br>

④ 「接続開始」

<br>

⑤ Windowsでも同じ4桁PIN

<br>

⑥ 「Windows / カメラ受信」

<br>

⑦ 「接続開始」

<br><br>

Offer / Answerなどの操作は不要です。

</div>



<button
    id="reset"
    class="danger">

接続リセット

</button>

</div>



<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const role =
document.getElementById("role");

const pin =
document.getElementById("pin");

const connect =
document.getElementById("connect");

const status =
document.getElementById("status");

const ipadPanel =
document.getElementById("ipadPanel");

const windowsPanel =
document.getElementById("windowsPanel");

const localVideo =
document.getElementById("localVideo");

const remoteVideo =
document.getElementById("remoteVideo");

const camera =
document.getElementById("camera");

const switchCamera =
document.getElementById("switchCamera");

const fullscreen =
document.getElementById("fullscreen");

const reset =
document.getElementById("reset");


/* =====================================================
   VARIABLES
===================================================== */

let peer = null;

let localStream = null;

let currentCamera = "environment";

let connected = false;


/* =====================================================
   UI
===================================================== */

role.addEventListener(
"change",
updateRole
);


function updateRole() {

    const isIPad =
        role.value === "ipad";

    ipadPanel.classList.toggle(
        "hidden",
        !isIPad
    );

    windowsPanel.classList.toggle(
        "hidden",
        isIPad
    );

}


updateRole();


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    message,
    type = ""
) {

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* =====================================================
   PIN
===================================================== */

function validPIN() {

    return /^[0-9]{4}$/.test(
        pin.value
    );

}


/* =====================================================
   ID
===================================================== */

/*
    同じPINなら同じ部屋に入る。

    PeerJS IDには数字だけでなく
    prefixを付ける。
*/

function makeRoomID() {

    const clean =
        pin.value.trim();

    return "camera-room-" + clean;

}


/* =====================================================
   CONNECT
===================================================== */

connect.addEventListener(
"click",
async () => {

    if (!validPIN()) {

        setStatus(
            "4桁のPINを入力してください。",
            "error"
        );

        return;

    }


    connect.disabled = true;


    if (
        role.value === "ipad"
    ) {

        await startIPad();

    } else {

        await startWindows();

    }

});


/* =====================================================
   IPAD
===================================================== */

async function startIPad() {

    try {

        setStatus(
            "カメラを起動しています..."
        );


        await startCamera();


        const room =
            makeRoomID();


        setStatus(
            "Windowsを待っています..."
        );


        peer =
        new Peer(

            room,

            {
                debug:2
            }

        );


        peer.on(
            "open",
            () => {

                setStatus(
                    "接続待機中。Windowsで同じPINを入力してください。",
                    "ok"
                );

            }
        );


        peer.on(
            "call",
            call => {

                setStatus(
                    "Windowsと接続しています..."
                );


                call.answer(
                    localStream
                );


                call.on(
                    "stream",
                    () => {

                        connected = true;

                        setStatus(
                            "Windowsにカメラを送信中。",
                            "ok"
                        );

                    }
                );


                call.on(
                    "close",
                    () => {

                        connected = false;

                        setStatus(
                            "Windowsとの接続が終了しました。"
                        );

                    }
                );


                call.on(
                    "error",
                    error => {

                        console.error(error);

                        setStatus(
                            "接続エラー: " +
                            error.message,
                            "error"
                        );

                    }
                );

            }
        );


        peer.on(
            "error",
            error => {

                console.error(error);

                setStatus(
                    "PeerJSエラー: " +
                    error.message,
                    "error"
                );

            }
        );


    } catch(error) {

        console.error(error);

        setStatus(
            "iPad開始失敗: " +
            error.message,
            "error"
        );

        connect.disabled = false;

    }

}


/* =====================================================
   WINDOWS
===================================================== */

async function startWindows() {

    try {

        setStatus(
            "Windowsを接続しています..."
        );


        peer =
        new Peer(

            undefined,

            {
                debug:2
            }

        );


        peer.on(
            "open",
            () => {

                const room =
                    makeRoomID();


                setStatus(
                    "iPadを探しています..."
                );


                const call =
                    peer.call(
                        room,
                        new MediaStream()
                    );


                call.on(
                    "stream",
                    stream => {

                        remoteVideo.srcObject =
                            stream;


                        remoteVideo
                            .play()
                            .catch(() => {});


                        connected = true;


                        setStatus(
                            "📡 iPadカメラ受信中",
                            "ok"
                        );

                    }
                );


                call.on(
                    "close",
                    () => {

                        connected = false;

                        setStatus(
                            "iPadとの接続が終了しました。"
                        );

                    }
                );


                call.on(
                    "error",
                    error => {

                        console.error(error);

                        setStatus(
                            "接続エラー: " +
                            error.message,
                            "error"
                        );

                    }
                );

            }
        );


        peer.on(
            "error",
            error => {

                console.error(error);

                /*
                    roomが存在しない場合、
                    iPadがまだ起動していない。
                */

                if (
                    error.type ===
                    "peer-unavailable"
                ) {

                    setStatus(
                        "iPadが見つかりません。iPad側を先に接続してください。",
                        "error"
                    );

                } else {

                    setStatus(
                        "PeerJSエラー: " +
                        error.message,
                        "error"
                    );

                }

            }
        );


    } catch(error) {

        console.error(error);

        setStatus(
            "Windows開始失敗: " +
            error.message,
            "error"
        );

        connect.disabled = false;

    }

}


/* =====================================================
   CAMERA
===================================================== */

camera.addEventListener(
"click",
startCamera
);


async function startCamera() {

    try {

        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track =>
                    track.stop()
                );

        }


        localStream =
        await navigator.mediaDevices
        .getUserMedia({

            video: {

                facingMode:
                    currentCamera,

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                },

                frameRate:{
                    ideal:30,
                    max:60
                }

            },

            audio:false

        });


        localVideo.srcObject =
            localStream;


        await localVideo.play();


        camera.textContent =
            "カメラ再起動";


        setStatus(
            "カメラ起動完了。",
            "ok"
        );

    } catch(error) {

        console.error(error);

        setStatus(
            "カメラを起動できません: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

switchCamera.addEventListener(
"click",
async () => {

    currentCamera =
        currentCamera ===
        "environment"

        ? "user"

        : "environment";


    await startCamera();


});


/* =====================================================
   FULLSCREEN
===================================================== */

fullscreen.addEventListener(
"click",
async () => {

    if (
        remoteVideo.requestFullscreen
    ) {

        await remoteVideo
            .requestFullscreen();

    }

});


/* =====================================================
   RESET
===================================================== */

reset.addEventListener(
"click",
() => {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

        localStream = null;

    }


    if (peer) {

        try {
            peer.destroy();
        } catch (_) {}

        peer = null;

    }


    localVideo.srcObject =
        null;

    remoteVideo.srcObject =
        null;


    connected = false;

    connect.disabled =
        false;


    setStatus(
        "リセットしました。"
    );

});


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
"visibilitychange",
() => {

    /*
        iOS Safariはバックグラウンドにすると
        カメラ/WebRTCを停止する場合があります。
    */

    if (
        document.visibilityState ===
        "visible"
    ) {

        console.log(
            "ページ復帰"
        );

    }

});


</script>

</body>
</html>
