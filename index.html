<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPad 人差し指でお絵描き ＆ リアルタイム配信</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ステージ */
    #stage {
      position: relative;
      width: 800px;
      height: 600px;
      max-width: 95vw;
      max-height: 65vh;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    /* カメラ映像・お絵描きキャンバス・カーソルキャンバス */
    video, .layer-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 鏡合わせ表示 */
    }

    /* カラーパレット & UI */
    #palette {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(22, 27, 34, 0.85);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid #30363d;
      z-index: 30;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .color-btn:active, .color-btn.active {
      transform: scale(1.25);
      border-color: #58a6ff;
    }

    .clear-btn {
      background: #da3633;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    /* コントロールパネル */
    #control-panel {
      margin-top: 12px;
      background: rgba(22, 27, 34, 0.9);
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid #30363d;
      text-align: center;
      z-index: 20;
    }

    input, button {
      padding: 6px 12px;
      font-size: 14px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    input { background: #161b22; color: #fff; width: 120px; text-align: center; }
    .btn-connect { background: #238636; color: white; cursor: pointer; border: none; font-weight: bold; }
    .status { margin-bottom: 4px; font-weight: bold; color: #58a6ff; font-size: 14px; }
  </style>

  <!-- MediaPipe Hands ＆ PeerJS -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>✏️ 人差し指エアペイント</h2>

  <div id="stage">
    <video id="webcam" autoplay playsinline></video>
    <!-- お絵描き内容を保持するキャンバス -->
    <canvas id="paint-canvas" class="layer-canvas"></canvas>
    <!-- 人差し指のカーソルやUIを描画するキャンバス -->
    <canvas id="ui-canvas" class="layer-canvas"></canvas>

    <!-- カラーパレット -->
    <div id="palette">
      <div class="color-btn active" style="background: #ff0055;" onclick="selectColor('#ff0055', this)"></div>
      <div class="color-btn" style="background: #00ff66;" onclick="selectColor('#00ff66', this)"></div>
      <div class="color-btn" style="background: #00aaff;" onclick="selectColor('#00aaff', this)"></div>
      <div class="color-btn" style="background: #ffcc00;" onclick="selectColor('#ffcc00', this)"></div>
      <div class="color-btn" style="background: #ffffff;" onclick="selectColor('#ffffff', this)"></div>
      <button class="clear-btn" onclick="clearCanvas(true)">全消去</button>
    </div>
  </div>

  <div id="control-panel">
    <div id="status" class="status">通信初期化中...</div>
    <div id="connection-ui">
      ID: <span id="my-id" style="color: #f2e05a; font-weight: bold;">----</span>
      <input type="text" id="target-id" placeholder="相手のID">
      <button class="btn-connect" onclick="connectToPeer()">iPadから接続</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const paintCanvas = document.getElementById('paint-canvas');
    const paintCtx = paintCanvas.getContext('2d');
    const uiCanvas = document.getElementById('ui-canvas');
    const uiCtx = uiCanvas.getContext('2d');
    const statusText = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');

    let peer = null;
    let dataConnection = null;

    let currentColor = '#ff0055';
    let prevPoint = null; // 前回の指先座標

    // --- PeerJS (WebRTC通信) ---
    const customId = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer(customId);

    peer.on('open', (id) => {
      myIdSpan.innerText = id;
      statusText.innerText = "Windows側はこのIDをiPadに入力して待機してください";
    });

    peer.on('connection', (conn) => {
      dataConnection = conn;
      setupDataReceiver();
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        videoElement.srcObject = remoteStream;
        statusText.innerText = "iPadからの映像を受信中！お絵描きデータを同期します";
      });
    });

    function connectToPeer() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert("接続先のIDを入力してください");

      statusText.innerText = "接続中...";
      dataConnection = peer.connect(targetId);
      dataConnection.on('open', () => {
        statusText.innerText = "接続成功！指先トラッキングを開始します";
        initHandTracking(true, targetId);
      });
    }

    // Windows側（データ受信）：iPadから送られた描画データを受け取って描画
    function setupDataReceiver() {
      dataConnection.on('data', (data) => {
        if (data.type === 'draw_line') {
          drawLineOnCanvas(data.p1, data.p2, data.color);
        } else if (data.type === 'clear') {
          clearCanvas(false);
        } else if (data.type === 'cursor') {
          drawCursorOnUI(data.point, data.color);
        }
      });
    }

    // --- 色選択 ＆ キャンバスクリア ---
    function selectColor(color, element) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');
    }

    function clearCanvas(broadcast = true) {
      paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      if (broadcast && dataConnection && dataConnection.open) {
        dataConnection.send({ type: 'clear' });
      }
    }

    // --- 描画関数 ---
    function drawLineOnCanvas(p1, p2, color) {
      paintCtx.beginPath();
      paintCtx.moveTo(p1.x, p1.y);
      paintCtx.lineTo(p2.x, p2.y);
      paintCtx.strokeStyle = color;
      paintCtx.lineWidth = 6;
      paintCtx.lineCap = 'round';
      paintCtx.lineJoin = 'round';
      paintCtx.stroke();
    }

    function drawCursorOnUI(point, color) {
      uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
      if (!point) return;

      uiCtx.beginPath();
      uiCtx.arc(point.x, point.y, 8, 0, 2 * Math.PI);
      uiCtx.fillStyle = color;
      uiCtx.fill();
      uiCtx.strokeStyle = '#ffffff';
      uiCtx.lineWidth = 2;
      uiCtx.stroke();
    }

    // --- MediaPipe Hands (人差し指でお絵描き) ---
    function initHandTracking(isCameraOwner, targetId = null) {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        const w = videoElement.videoWidth || 800;
        const h = videoElement.videoHeight || 600;

        if (paintCanvas.width !== w || paintCanvas.height !== h) {
          paintCanvas.width = w;
          paintCanvas.height = h;
          uiCanvas.width = w;
          uiCanvas.height = h;
        }

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];

          // 人差し指の先端 (8番目のランドマーク)
          const indexTip = landmarks[8];
          const currentPoint = {
            x: indexTip.x * w,
            y: indexTip.y * h
          };

          // 前回の点があれば線を引く
          if (prevPoint) {
            drawLineOnCanvas(prevPoint, currentPoint, currentColor);

            // データ通信でWindows側へ描画情報をリアルタイム送信
            if (dataConnection && dataConnection.open) {
              dataConnection.send({
                type: 'draw_line',
                p1: prevPoint,
                p2: currentPoint,
                color: currentColor
              });
            }
          }

          // 指先カーソルを描画
          drawCursorOnUI(currentPoint, currentColor);
          if (dataConnection && dataConnection.open) {
            dataConnection.send({
              type: 'cursor',
              point: currentPoint,
              color: currentColor
            });
          }

          prevPoint = currentPoint;
          statusText.innerText = "人差し指を動かしてお絵描き中！";
        } else {
          prevPoint = null;
          drawCursorOnUI(null, null);
          if (dataConnection && dataConnection.open) {
            dataConnection.send({ type: 'cursor', point: null });
          }
          statusText.innerText = "カメラに人差し指を向けてください";
        }
      });

      if (isCameraOwner) {
        const camera = new Camera(videoElement, {
          onFrame: async () => {
            if (videoElement.readyState >= 2) {
              await hands.send({ image: videoElement });
            }
          },
          width: 640,
          height: 480,
          facingMode: 'user'
        });

        camera.start().then(() => {
          const stream = videoElement.srcObject;
          peer.call(targetId, stream);
          statusText.innerText = "配信中！人差し指で自由に描画できます";
        });
      }
    }
  </script>
</body>
</html>
