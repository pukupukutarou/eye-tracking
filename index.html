<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad 視線追跡テスト</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #container {
      position: relative;
      width: 640px;
      height: 480px;
      max-width: 100vw;
      max-height: 70vh;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      transform: scaleX(-1); /* 鏡合わせ表示 */
    }
    #info {
      margin-top: 15px;
      font-size: 18px;
      text-align: center;
    }
  </style>

  <!-- MediaPipe Face Landmarker 読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <h2>👀 iPad 視線検知プロトタイプ</h2>
  
  <div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div id="info">カメラを準備中...</div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const infoElement = document.getElementById('info');

    // FaceMesh（顔・瞳のランドマーク抽出）の初期化
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true, // 虹彩（黒目）の検出を有効化
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // 検出結果の描画処理
    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // 左右の虹彩（黒目）のインデックス
        // 左目虹彩: 468, 右目虹彩: 473
        const leftIris = landmarks[468];
        const rightIris = landmarks[473];

        // 描画: 黒目の位置に赤い円を描く
        drawEyeCircle(leftIris);
        drawEyeCircle(rightIris);

        // 簡易的な視線方向の判定（黒目の位置から計算）
        const eyeX = (leftIris.x + rightIris.x) / 2;
        const eyeY = (leftIris.y + rightIris.y) / 2;

        infoElement.innerText = `検出成功！ 目の相対座標: X=${eyeX.toFixed(2)}, Y=${eyeY.toFixed(2)}`;
      } else {
        infoElement.innerText = "顔をカメラに向けてください";
      }
      canvasCtx.restore();
    }

    function drawEyeCircle(point) {
      const x = point.x * canvasElement.width;
      const y = point.y * canvasElement.height;
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 6, 0, 2 * Math.PI);
      canvasCtx.fillStyle = '#ff0055';
      canvasCtx.fill();
    }

    // カメラの起動処理（iPad対応）
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 640,
      height: 480,
      facingMode: 'user' // インカメラ指定
    });

    camera.start().then(() => {
      infoElement.innerText = "カメラ起動完了。顔を映してください。";
    }).catch(err => {
      infoElement.innerText = "カメラの起動に失敗しました。HTTPSでアクセスしているか確認してください。";
      console.error(err);
    });
  </script>
</body>
</html>
