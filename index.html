<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Tracking WebRTC Streamer</title>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    #stage { position: relative; width: 640px; height: 480px; border-radius: 8px; overflow: hidden; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #control-panel { margin-top: 16px; background: #161b22; padding: 16px; border-radius: 8px; text-align: center; }
    input, button { padding: 8px; font-size: 1rem; margin: 4px; }
  </style>

  <!-- PeerJS & MediaPipe Hands -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

  <h2>人差し指位置検出 & WebRTC 送信</h2>
  <div id="stage">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div id="control-panel">
    <div>ID: <span id="my-id" style="color: #f2e05a;">----</span></div>
    <input type="text" id="target-id" placeholder="Windows側のID">
    <button id="connect-btn" onclick="startTrackingAndConnect()">接続開始</button>
    <div id="status">準備完了</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');

    let peer = new Peer();
    let dataConn = null;

    peer.on('open', (id) => { myIdSpan.innerText = id; });

    // MediaPipe Hands の設定
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        // 8番目のランドマークが人差し指の先端 (Index Finger Tip)
        const indexTip = landmarks[8];

        // 鏡像に合わせてX座標を反転 (1 - x)
        const pointData = {
          x: 1 - indexTip.x,
          y: indexTip.y
        };

        // データ接続がアクティブならWindowsへ送信
        if (dataConn && dataConn.open) {
          dataConn.send(pointData);
          statusText.innerText = `送信中: X=${pointData.x.toFixed(2)}, Y=${pointData.y.toFixed(2)}`;
        }
      }
    });

    async function startTrackingAndConnect() {
      const targetId = document.getElementById('target-id').value.trim();
      if (!targetId) return alert("送信先のIDを入力してください");

      // 1. カメラ起動
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      videoElement.srcObject = stream;

      // 2. PeerJSデータ通信の接続確立
      dataConn = peer.connect(targetId);
      dataConn.on('open', () => {
        statusText.innerText = "Windowsにデータ通信接続完了！";
      });

      // 3. MediaPipe カメラ処理ループ開始
      const camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640,
        height: 480
      });
      camera.start();
    }
  </script>
</body>
</html>
