<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPad リアルタイム 3D Face Mesh</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* メインの描画領域 */
    #stage {
      position: relative;
      width: 800px;
      height: 600px;
      max-width: 95vw;
      max-height: 75vh;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 鏡合わせ表示 */
    }

    /* 操作パネル */
    #control-panel {
      margin-top: 15px;
      background: rgba(22, 27, 34, 0.9);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid #30363d;
      text-align: center;
      z-index: 20;
    }

    input, button {
      padding: 8px 12px;
      font-size: 15px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    input { background: #161b22; color: #fff; width: 120px; text-align: center; }
    button { background: #238636; color: white; cursor: pointer; border: none; font-weight: bold; }
    button:hover { background: #2ea043; }
    .status { margin-bottom: 6px; font-weight: bold; color: #58a6ff; font-size: 14px; }
  </style>

  <!-- MediaPipe Face Mesh ＆ 描画ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <!-- PeerJS (WebRTC通信) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>🎭 リアルタイム 3D Face Mesh ビューワー</h2>

  <div id="stage">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div id="control-panel">
    <div id="status" class="status">通信初期化中...</div>
    <div id="connection-ui">
      ID: <span id="my-id" style="color: #f2e05a; font-weight: bold;">----</span>
      <input type="text" id="target-id" placeholder="相手のID">
      <button onclick="connectToPeer()">iPadから接続</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');

    let peer = null;
    let dataConnection = null;

    // --- PeerJS 通信基盤 ---
    const customId = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer(customId);

    peer.on('open', (id) => {
      myIdSpan.innerText = id;
      statusText.innerText = "Windows側はこのIDをiPadに入力して待機してください";
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        // Windows側：キャンバスを描画モードにしてリモート映像を表示
        videoElement.srcObject = remoteStream;
        statusText.innerText = "iPadからのリアルタイムFace Meshを受信中！";
        startMeshProcessing(false); // 受信側もローカルで描画処理を走らせる
      });
    });

    function connectToPeer() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert("接続先のIDを入力してください");

      statusText.innerText = "接続中...";
      dataConnection = peer.connect(targetId);
      dataConnection.on('open', () => {
        statusText.innerText = "接続成功！カメラとFace Meshを開始します";
        startCameraAndMesh(targetId);
      });
    }

    // --- 3D Face Mesh 処理 ＆ 描画エンジン ---
    function startMeshProcessing(isCameraOwner, targetId = null) {
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true, // 輪郭・パーツ精度の向上
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults((results) => {
        canvasElement.width = videoElement.videoWidth || 800;
        canvasElement.height = videoElement.videoHeight || 600;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          for (const landmarks of results.multiFaceLandmarks) {
            // 1. 顔全体を覆うメッシュ（網目）の描画
            drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {
              color: '#C0C0C070',
              lineWidth: 1
            });

            // 2. 目の輪郭・黒目の強調ライン
            drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, { color: '#FF3030' });
            drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYEBROW, { color: '#FF3030' });
            drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, { color: '#30FF30' });
            drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYEBROW, { color: '#30FF30' });

            // 3. 顔の輪郭ライン
            drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, { color: '#E0E0E0' });

            // 4. 唇のライン
            drawingUtils.drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, { color: '#E0E0FF' });
          }
          statusText.innerText = "顔メッシュトラッキング中！";
        } else {
          statusText.innerText = "顔をカメラに向けてください";
        }
        canvasCtx.restore();
      });

      if (isCameraOwner) {
        const camera = new Camera(videoElement, {
          onFrame: async () => {
            await faceMesh.send({ image: videoElement });
          },
          width: 640,
          height: 480,
          facingMode: 'user'
        });

        camera.start().then(() => {
          const stream = videoElement.srcObject;
          peer.call(targetId, stream);
          statusText.innerText = "iPadからリアルタイムFace Mesh映像を配信中！";
        });
      } else {
        // Windows側（受信映像に対して毎フレームFace Meshを適用）
        async function processFrame() {
          if (videoElement.currentTime > 0 && !videoElement.paused && !videoElement.ended) {
            await faceMesh.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        }
        videoElement.addEventListener('play', () => {
          processFrame();
        });
      }
    }

    function startCameraAndMesh(targetId) {
      startMeshProcessing(true, targetId);
    }
  </script>
</body>
</html>
