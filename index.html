<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad WebCamera System</title>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- MediaPipe FaceMesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* 映像＋Canvas表示エリア */
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ミラー（左右反転）制御クラス */
    .mirror {
      transform: scaleX(-1);
    }

    /* UI パネル */
    #ui-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 10px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 320px;
      border: 1px solid #333;
    }

    input, button {
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #555;
    }

    input {
      background: #222;
      color: #fff;
      text-align: center;
    }

    button {
      background: #4a90e2;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #357abd;
    }

    .ipad-ui { display: none; }
    body.ipad-mode .ipad-ui { display: flex; flex-direction: column; gap: 10px; }
    body.ipad-mode .pc-ui { display: none; }
  </style>
</head>
<body class="pc-mode">

  <div id="container">
    <!-- iPadのカメラストリームを再生するvideo要素 -->
    <video id="webcam" playsinline autoplay muted class="mirror"></video>
    <!-- FaceMesh（オーバーレイ描画用） -->
    <canvas id="mesh-canvas" class="mirror"></canvas>
  </div>

  <div id="ui-panel">
    <!-- PC用 UI -->
    <div class="pc-ui">
      <div><b>PC モード（受信側）</b></div>
      <div>ID: <input type="text" id="pc-id-input" value="1234"></div>
      <button id="pc-start-btn">このIDで待機する</button>
      <div id="pc-status">IDを決めて「待機する」を押してください</div>
    </div>

    <!-- iPad用 UI -->
    <div class="ipad-ui">
      <div><b>iPad モード（カメラ送信側）</b></div>
      <input type="text" id="target-id-input" placeholder="PCのIDを入力" value="1234">
      <button id="connect-btn">PCに接続してカメラ送信</button>
      <div id="ipad-status">PCのIDを入力してください</div>
    </div>

    <!-- 共通設定: ミラー反転スイッチ -->
    <button id="toggle-mirror-btn">ミラー反転 (ON/OFF)</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isIpad = urlParams.get('role') === 'ipad';

    const videoEl = document.getElementById('webcam');
    const canvasEl = document.getElementById('mesh-canvas');
    const ctx = canvasEl.getContext('2d');
    const toggleMirrorBtn = document.getElementById('toggle-mirror-btn');

    let isMirrored = true;

    // ミラー設定（左右反転）の切り替え
    toggleMirrorBtn.addEventListener('click', () => {
      isMirrored = !isMirrored;
      if (isMirrored) {
        videoEl.classList.add('mirror');
        canvasEl.classList.add('mirror');
      } else {
        videoEl.classList.remove('mirror');
        canvasEl.classList.remove('mirror');
      }
    });

    // Canvasサイズの同期
    function resizeCanvas() {
      canvasEl.width = videoEl.videoWidth || window.innerWidth;
      canvasEl.height = videoEl.videoHeight || window.innerHeight;
    }
    videoEl.addEventListener('loadedmetadata', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    // FaceMesh メッシュ描画関数
    function drawMesh(landmarks) {
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      if (!landmarks) return;

      const w = canvasEl.width;
      const h = canvasEl.height;

      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 1;

      if (typeof FACEMESH_TESSELATION !== 'undefined') {
        for (const i of FACEMESH_TESSELATION) {
          const p1 = landmarks[i[0]];
          const p2 = landmarks[i[1]];
          ctx.beginPath();
          ctx.moveTo(p1.x * w, p1.y * h);
          ctx.lineTo(p2.x * w, p2.y * h);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = '#00ffcc';
        for (const p of landmarks) {
          ctx.beginPath();
          ctx.arc(p.x * w, p.y * h, 1.5, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }

    if (isIpad) {
      // ---------------- 【 iPad モード（Webカメラ化＋送信） 】 ----------------
      document.body.className = 'ipad-mode';
      const targetIdInput = document.getElementById('target-id-input');
      const connectBtn = document.getElementById('connect-btn');
      const ipadStatus = document.getElementById('ipad-status');

      const peer = new Peer();
      let localStream = null;

      // FaceMesh の初期化
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

      faceMesh.onResults((results) => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          drawMesh(results.multiFaceLandmarks[0]);
        } else {
          ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
        }
      });

      // iPad 自身のカメラ起動
      navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false })
        .then((stream) => {
          localStream = stream;
          videoEl.srcObject = stream; // iPadローカル画面にも映す

          // FaceMesh処理ループ
          const camera = new Camera(videoEl, {
            onFrame: async () => { await faceMesh.send({ image: videoEl }); },
            width: 1280, height: 720
          });
          camera.start();
          ipadStatus.innerText = "カメラ起動完了。PCへ接続してください。";
        })
        .catch((err) => {
          ipadStatus.innerText = "カメラ取得エラー: " + err.message;
        });

      // PCへの接続処理（映像ストリームの送信）
      connectBtn.addEventListener('click', () => {
        const targetId = targetIdInput.value.trim();
        if (!targetId || !localStream) return;

        ipadStatus.innerText = "PCへ接続・映像ストリーム送信中...";

        // PeerJSの media call でカメラ映像（ストリーム）をPC宛てに発信
        const call = peer.call(targetId, localStream);

        call.on('stream', () => {
          ipadStatus.innerText = "PCと接続完了！映像同期中";
        });

        call.on('error', (err) => {
          ipadStatus.innerText = "接続エラー: " + err.message;
        });
      });

    } else {
      // ---------------- 【 PC モード（受信・映像同期側） 】 ----------------
      document.body.className = 'pc-mode';
      const pcIdInput = document.getElementById('pc-id-input');
      const pcStartBtn = document.getElementById('pc-start-btn');
      const pcStatus = document.getElementById('pc-status');

      // PC側のFaceMesh初期化（受信したiPad映像をリアルタイム解析してメッシュ描画）
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

      faceMesh.onResults((results) => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          drawMesh(results.multiFaceLandmarks[0]);
        } else {
          ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
        }
      });

      let peer = null;

      pcStartBtn.addEventListener('click', () => {
        const customId = pcIdInput.value.trim();
        if (!customId) return;

        peer = new Peer(customId);

        peer.on('open', (id) => {
          pcStatus.innerText = `待機中 (ID: ${id})\niPad側でこのIDを入力してください`;
        });

        peer.on('error', (err) => {
          pcStatus.innerText = "エラー: " + err.type;
        });

        // iPadからの映像呼び出し（Media Call）を受信
        peer.on('call', (call) => {
          pcStatus.innerText = "iPadからの接続を受信中...";

          call.answer(); // 映像受信用に回答

          call.on('stream', (remoteStream) => {
            pcStatus.innerText = "iPadのカメラ映像と同期完了！";
            videoEl.srcObject = remoteStream; // PC画面のvideoにiPadの映像を直接割り当てる

            // 受信したリアルタイム映像に対してPC側でもFaceMeshをループ起動
            const camera = new Camera(videoEl, {
              onFrame: async () => { await faceMesh.send({ image: videoEl }); },
              width: 1280, height: 720
            });
            camera.start();
          });
        });
      });
    }
  </script>
</body>
</html>
