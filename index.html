
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Camera Link</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: min(900px, 100%);
    padding: 20px;
}

h1 {
    font-size: 24px;
    margin: 0 0 8px;
}

.subtitle {
    color: #888;
    margin-bottom: 20px;
}

.panel {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
}

label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 8px;
}

select,
input,
button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #3a3a3a;
    background: #0d0d0d;
    color: white;
    font-size: 16px;
}

.pin {
    font-size: 28px;
    text-align: center;
    letter-spacing: 10px;
}

button {
    margin-top: 12px;
    border: 0;
    background: #287cff;
    font-weight: bold;
    cursor: pointer;
}

button.secondary {
    background: #292929;
}

button.danger {
    background: #9b2929;
}

button:disabled {
    opacity: .5;
}

.status {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #0d0d0d;
    color: #aaa;
    word-break: break-word;
}

.status.ok {
    color: #70e090;
}

.status.error {
    color: #ff7777;
}

/* ライブモニター */

.monitor {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #292929;
}

.liveVideo {
    display: block;
    width: 100%;
    height: auto;
    max-height: 80vh;
    background: #000;
    object-fit: contain;

    /* 動画プレイヤーの操作を無効化 */
    pointer-events: none;

    /* 選択不可 */
    user-select: none;
}

.liveLabel {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(0,0,0,.65);
    color: #fff;
    font-size: 12px;
    pointer-events: none;
}

.liveDot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3030;
    margin-right: 5px;
}

.monitorPlaceholder {
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 15px;
}

.hidden {
    display: none !important;
}

.info {
    font-size: 13px;
    line-height: 1.7;
    color: #888;
}

@media (max-width: 600px) {
    .app {
        padding: 12px;
    }

    .panel {
        padding: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

<h1>📡 Camera Link</h1>

<div class="subtitle">
iPad → Windows / Live Monitor
</div>


<!-- 接続 -->

<div class="panel">

<label>端末の役割</label>

<select id="role">

<option value="ipad">
iPad / カメラ送信
</option>

<option value="windows">
Windows / ライブ受信
</option>

</select>

<br><br>

<label>4桁PIN</label>

<input
    id="pin"
    class="pin"
    type="password"
    inputmode="numeric"
    maxlength="4"
    placeholder="0000"
>

<button id="connectBtn">
接続開始
</button>

<div id="status" class="status">
待機中
</div>

</div>



<!-- iPad -->

<div id="ipadPanel" class="panel">

<h2>📱 iPad Camera</h2>

<div class="monitor">

<video
    id="localVideo"
    class="liveVideo"
    autoplay
    muted
    playsinline
    disablepictureinpicture
    controlslist="nodownload noplaybackrate nofullscreen">
</video>

<div class="liveLabel">
<span class="liveDot"></span>
LOCAL CAMERA
</div>

</div>

<button id="cameraBtn">
カメラ開始
</button>

<button id="switchCameraBtn" class="secondary">
カメラ切替
</button>

</div>



<!-- Windows -->

<div id="windowsPanel" class="panel hidden">

<h2>🖥 Windows Live Monitor</h2>

<div class="monitor">

<div id="placeholder" class="monitorPlaceholder">
接続待機中...
</div>

<video
    id="remoteVideo"
    class="liveVideo hidden"
    autoplay
    muted
    playsinline
    disablepictureinpicture
    controlslist="nodownload noplaybackrate nofullscreen">
</video>

<div id="liveLabel" class="liveLabel hidden">
<span class="liveDot"></span>
LIVE
</div>

</div>

<button id="fullscreenBtn" class="secondary">
全画面表示
</button>

</div>



<div class="panel info">

<b>接続方法</b>

<br>

1. iPadで4桁PINを入力して接続開始

<br>

2. カメラを許可

<br>

3. Windowsで同じPINを入力して接続開始

<br>

4. Windowsにライブ映像が表示されます

<br><br>

Offer / Answerの手動操作はありません。

</div>


<button id="resetBtn" class="danger">
接続リセット
</button>

</div>



<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const role = document.getElementById("role");
const pin = document.getElementById("pin");
const connectBtn = document.getElementById("connectBtn");
const statusBox = document.getElementById("status");

const ipadPanel = document.getElementById("ipadPanel");
const windowsPanel = document.getElementById("windowsPanel");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

const cameraBtn = document.getElementById("cameraBtn");
const switchCameraBtn = document.getElementById("switchCameraBtn");

const fullscreenBtn = document.getElementById("fullscreenBtn");
const resetBtn = document.getElementById("resetBtn");

const placeholder = document.getElementById("placeholder");
const liveLabel = document.getElementById("liveLabel");


/* =====================================================
   VARIABLES
===================================================== */

let peer = null;
let localStream = null;
let activeCall = null;

let currentCamera = "environment";


/* =====================================================
   UI
===================================================== */

function updateRole() {

    const isIPad = role.value === "ipad";

    ipadPanel.classList.toggle("hidden", !isIPad);
    windowsPanel.classList.toggle("hidden", isIPad);

}

role.addEventListener("change", updateRole);

updateRole();


function setStatus(message, type = "") {

    statusBox.textContent = message;
    statusBox.className = "status " + type;

}


/* =====================================================
   PIN
===================================================== */

function validPIN() {

    return /^[0-9]{4}$/.test(pin.value.trim());

}

function roomID() {

    return "camera-room-" + pin.value.trim();

}


/* =====================================================
   CONNECT
===================================================== */

connectBtn.addEventListener("click", async () => {

    if (!validPIN()) {

        setStatus("4桁のPINを入力してください。", "error");
        return;

    }

    connectBtn.disabled = true;

    if (role.value === "ipad") {

        await startIPad();

    } else {

        await startWindows();

    }

});


/* =====================================================
   iPAD
===================================================== */

async function startIPad() {

    try {

        setStatus("カメラを起動しています...");

        await startCamera();

        if (!localStream) {

            connectBtn.disabled = false;
            return;

        }

        setStatus("接続サーバーに接続しています...");

        peer = new Peer(roomID(), {
            debug: 1
        });


        peer.on("open", () => {

            setStatus(
                "待機中。Windowsで同じPINを入力してください。",
                "ok"
            );

        });


        /*
            Windowsからの接続を受け取る
        */

        peer.on("connection", connection => {

            setStatus("Windowsを検出。映像を送信しています...");

            connection.on("open", () => {

                const call = peer.call(
                    connection.peer,
                    localStream
                );

                activeCall = call;

                call.on("close", () => {

                    setStatus("Windowsとの接続が終了しました。");

                });

                call.on("error", error => {

                    console.error(error);

                    setStatus(
                        "映像送信エラー: " + error.message,
                        "error"
                    );

                });

            });

        });


        peer.on("error", error => {

            console.error(error);

            setStatus(
                "接続エラー: " + error.message,
                "error"
            );

            connectBtn.disabled = false;

        });


    } catch (error) {

        console.error(error);

        setStatus(
            "iPad開始失敗: " + error.message,
            "error"
        );

        connectBtn.disabled = false;

    }

}


/* =====================================================
   WINDOWS
===================================================== */

async function startWindows() {

    try {

        setStatus("Windows受信を開始しています...");

        peer = new Peer(undefined, {
            debug: 1
        });


        peer.on("open", () => {

            const target = roomID();

            setStatus("iPadを探しています...");


            /*
                iPadのPeerに接続する
            */

            const connection = peer.connect(target);

            connection.on("open", () => {

                setStatus("iPadを検出。映像接続中...");

            });


            /*
                iPad側からの映像通話を待つ
            */

            peer.on("call", call => {

                activeCall = call;

                call.answer();

                call.on("stream", stream => {

                    remoteVideo.srcObject = stream;

                    remoteVideo.classList.remove("hidden");
                    placeholder.classList.add("hidden");
                    liveLabel.classList.remove("hidden");

                    remoteVideo.play().catch(() => {});

                    setStatus("📡 LIVE / iPadカメラ受信中", "ok");

                });

                call.on("close", () => {

                    remoteVideo.srcObject = null;

                    remoteVideo.classList.add("hidden");
                    placeholder.classList.remove("hidden");
                    liveLabel.classList.add("hidden");

                    setStatus("iPadとの接続が終了しました。");

                });

                call.on("error", error => {

                    console.error(error);

                    setStatus(
                        "受信エラー: " + error.message,
                        "error"
                    );

                });

            });

        });


        peer.on("error", error => {

            console.error(error);

            if (error.type === "peer-unavailable") {

                setStatus(
                    "iPadが見つかりません。iPad側を先に接続してください。",
                    "error"
                );

            } else {

                setStatus(
                    "PeerJSエラー: " + error.message,
                    "error"
                );

            }

            connectBtn.disabled = false;

        });


    } catch (error) {

        console.error(error);

        setStatus(
            "Windows開始失敗: " + error.message,
            "error"
        );

        connectBtn.disabled = false;

    }

}


/* =====================================================
   CAMERA
===================================================== */

cameraBtn.addEventListener("click", startCamera);

async function startCamera() {

    try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error(
                "HTTPS環境でカメラを使用してください。"
            );

        }


        if (localStream) {

            localStream.getTracks().forEach(track => {
                track.stop();
            });

        }


        localStream = await navigator.mediaDevices.getUserMedia({

            video: {

                facingMode: currentCamera,

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                frameRate: {
                    ideal: 30,
                    max: 60
                }

            },

            audio: false

        });


        localVideo.srcObject = localStream;

        await localVideo.play();

        cameraBtn.textContent = "カメラ再起動";

        setStatus("カメラ起動完了。", "ok");

    } catch (error) {

        console.error(error);

        setStatus(
            "カメラ起動失敗: " + error.message,
            "error"
        );

    }

}


/* =====================================================
   CAMERA SWITCH
===================================================== */

switchCameraBtn.addEventListener("click", async () => {

    currentCamera =
        currentCamera === "environment"
            ? "user"
            : "environment";

    await startCamera();

});


/* =====================================================
   FULLSCREEN
===================================================== */

fullscreenBtn.addEventListener("click", async () => {

    const monitor = remoteVideo.parentElement;

    if (monitor.requestFullscreen) {

        await monitor.requestFullscreen();

    }

});


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener("click", () => {

    if (activeCall) {

        try {
            activeCall.close();
        } catch (_) {}

        activeCall = null;

    }


    if (localStream) {

        localStream.getTracks().forEach(track => {
            track.stop();
        });

        localStream = null;

    }


    if (peer) {

        try {
            peer.destroy();
        } catch (_) {}

        peer = null;

    }


    localVideo.srcObject = null;
    remoteVideo.srcObject = null;

    remoteVideo.classList.add("hidden");
    placeholder.classList.remove("hidden");
    liveLabel.classList.add("hidden");

    connectBtn.disabled = false;

    setStatus("リセットしました。");

});


</script>

</body>
</html>
