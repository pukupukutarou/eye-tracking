<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPad Camera Sender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    h2 { margin-bottom: 16px; font-size: 1.2rem; }
    #stage {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #30363d;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    #control-panel {
      margin-top: 16px;
      background: #161b22;
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid #30363d;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .input-row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    input[type="text"] {
      padding: 10px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      width: 120px;
      text-align: center;
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
      background: #238636;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #21262d; color: #484f58; }
    #status { margin-top: 12px; font-size: 0.9rem; color: #58a6ff; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>📱 iPad 映像配信</h2>

  <div id="stage">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div id="control-panel">
    <div>Windows側に表示されている4桁IDを入力:</div>
    <div class="input-row">
      <input type="text" id="target-id" placeholder="4桁数字" maxlength="4" pattern="[0-9]*" inputmode="numeric">
      <button id="start-btn" onclick="startStreaming()">配信開始</button>
    </div>
    <div id="status">待機中</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');

    let peer = new Peer();
    let localStream = null;

    peer.on('open', () => {
      statusText.innerText = "準備完了。4桁IDを入力して配信開始を押してください。";
    });

    peer.on('error', (err) => {
      console.error(err);
      statusText.innerText = `エラーが発生しました: ${err.type}`;
      startBtn.disabled = false;
    });

    async function startStreaming() {
      const targetId = document.getElementById('target-id').value.trim();
      if (targetId.length !== 4) {
        alert("送信先の4桁IDを入力してください。");
        return;
      }

      startBtn.disabled = true;
      statusText.innerText = "カメラアクセスを取得中...";

      try {
        // iPadの外カメラ（背後）を優先取得したい場合は facingMode: 'environment' に変更可能
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        videoElement.srcObject = localStream;
        statusText.innerText = "Windowsへ接続中...";

        const call = peer.call(targetId, localStream);

        call.on('close', () => {
          statusText.innerText = "通信が切断されました";
          startBtn.disabled = false;
        });

        statusText.innerText = "配信中！映像を送信しています。";

      } catch (err) {
        console.error(err);
        statusText.innerText = "カメラの起動に失敗しました。アクセス権限を確認してください。";
        startBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
