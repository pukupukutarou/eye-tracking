<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>iPad Face Camera</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #111;

    color: white;

    font-family:
        Arial,
        sans-serif;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

#app {

    width: 100%;
    max-width: 900px;

    padding: 20px;

}

h1 {

    font-size: 22px;

    margin-top: 0;

}

.panel {

    background: #222;

    border-radius: 14px;

    padding: 18px;

    margin-bottom: 15px;

}

input,
button {

    font-size: 18px;

    padding: 12px;

    border-radius: 8px;

    border: none;

}

input {

    width: 150px;

    text-align: center;

    letter-spacing: 5px;

}

button {

    cursor: pointer;

    margin-left: 8px;

}

video {

    width: 100%;

    max-height: 70vh;

    object-fit: contain;

    background: #000;

    border-radius: 12px;

}

#status {

    margin-top: 12px;

    color: #aaa;

    white-space: pre-wrap;

}

#faceInfo {

    margin-top: 10px;

    font-family: monospace;

    color: #7cff9a;

}

.hidden {

    display: none;

}

</style>

</head>

<body>

<div id="app">

<h1>
iPad Camera → Face Tracking → Windows
</h1>

<div class="panel">

<div>

<label>
4桁PIN
</label>

<br><br>

<input
    id="pin"
    maxlength="4"
    inputmode="numeric"
    placeholder="1234"
>

<button id="startButton">
開始
</button>

</div>

<div id="status">
待機中
</div>

<div id="faceInfo">
Face: -
</div>

</div>


<div class="panel">

<video
    id="video"
    autoplay
    playsinline
    muted
    controls="false"
></video>

</div>


<canvas
    id="faceCanvas"
    class="hidden"
></canvas>

</div>


<script type="module">

// ============================================================
// MediaPipe
// ============================================================

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


// ============================================================
// DOM
// ============================================================

const pinInput =
    document.getElementById("pin");

const startButton =
    document.getElementById("startButton");

const statusElement =
    document.getElementById("status");

const faceInfo =
    document.getElementById("faceInfo");

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("faceCanvas");


// ============================================================
// 状態
// ============================================================

let role = null;

let peer = null;

let dataConnection = null;

let mediaCall = null;

let localStream = null;

let faceLandmarker = null;

let lastVideoTime = -1;

let lastSendTime = 0;

let faceReady = false;


// ============================================================
// 設定
// ============================================================

// 正面カメラの場合。
// 動きが左右逆に感じた場合は true / false を変更。
const MIRROR_FACE_X = true;


// 顔データ送信間隔
const SEND_INTERVAL = 33;


// ============================================================
// Status
// ============================================================

function setStatus(text) {

    statusElement.textContent = text;

    console.log(text);

}


// ============================================================
// PIN
// ============================================================

function getPin() {

    const pin =
        pinInput.value.trim();

    if (!/^\d{4}$/.test(pin)) {

        alert("4桁のPINを入力してください");

        return null;

    }

    return pin;

}


// ============================================================
// Face Landmarker
// ============================================================

async function createFaceLandmarker() {

    setStatus(
        "MediaPipe Face Landmarkerを読み込み中..."
    );

    const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

    faceLandmarker =
        await FaceLandmarker.createFromOptions(
            vision,
            {

                baseOptions: {

                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

                },

                runningMode: "VIDEO",

                numFaces: 1,

                minFaceDetectionConfidence: 0.5,

                minFacePresenceConfidence: 0.5,

                minTrackingConfidence: 0.5,

                outputFaceBlendshapes: false,

                outputFacialTransformationMatrixes: true

            }
        );

    faceReady = true;

    console.log(
        "MediaPipe Face Landmarker ready"
    );

}


// ============================================================
// Camera
// ============================================================

async function startCamera() {

    setStatus(
        "iPadカメラを起動中..."
    );

    localStream =
        await navigator.mediaDevices.getUserMedia(
            {

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    frameRate: {
                        ideal: 30
                    }

                },

                audio: false

            }
        );

    video.srcObject =
        localStream;

    await video.play();

    setStatus(
        "カメラ起動完了"
    );

}


// ============================================================
// Peer ID
// ============================================================

function cameraPeerId(pin) {

    return "face-camera-" + pin;

}


// ============================================================
// iPad
// ============================================================

async function startIPad(pin) {

    role = "ipad";

    await startCamera();

    await createFaceLandmarker();

    const id =
        cameraPeerId(pin);

    setStatus(
        "PeerJS接続中...\n" +
        "Camera ID: " + id
    );

    peer =
        new Peer(
            id,
            {
                debug: 1
            }
        );


    // --------------------------------------------------------
    // Peer open
    // --------------------------------------------------------

    peer.on(
        "open",
        id => {

            setStatus(
                "iPad準備完了\n" +
                "Windows側を同じPINで開始してください"
            );

        }
    );


    // --------------------------------------------------------
    // WindowsからDataConnection
    // --------------------------------------------------------

    peer.on(
        "connection",
        conn => {

            console.log(
                "DataConnection:",
                conn.peer
            );

            dataConnection =
                conn;

            conn.on(
                "open",
                () => {

                    setStatus(
                        "Windowsと顔トラッキング接続完了"
                    );

                }
            );

            conn.on(
                "close",
                () => {

                    dataConnection =
                        null;

                    setStatus(
                        "Windowsとの接続が切れました"
                    );

                }
            );

        }
    );


    // --------------------------------------------------------
    // WindowsからVideo Call
    // --------------------------------------------------------

    peer.on(
        "call",
        call => {

            console.log(
                "Video Call received"
            );

            mediaCall =
                call;

            call.answer(
                localStream
            );

        }
    );


    // --------------------------------------------------------
    // Peer Error
    // --------------------------------------------------------

    peer.on(
        "error",
        error => {

            console.error(
                error
            );

            setStatus(
                "PeerJS ERROR:\n" +
                error.type +
                "\n" +
                error.message
            );

        }
    );


    // --------------------------------------------------------
    // Face tracking開始
    // --------------------------------------------------------

    requestAnimationFrame(
        processFace
    );

}


// ============================================================
// Windows
// ============================================================

async function startWindows(pin) {

    role = "windows";

    setStatus(
        "Windows側PeerJSを起動中..."
    );


    // --------------------------------------------------------
    // WindowsはランダムID
    // --------------------------------------------------------

    peer =
        new Peer(
            undefined,
            {
                debug: 1
            }
        );


    peer.on(
        "open",
        async myId => {

            console.log(
                "Windows Peer ID:",
                myId
            );

            const target =
                cameraPeerId(pin);


            // ------------------------------------------------
            // 顔データ用DataConnection
            // ------------------------------------------------

            dataConnection =
                peer.connect(
                    target,
                    {

                        reliable: false,

                        serialization: "json",

                        label: "face-tracking"

                    }
                );


            dataConnection.on(
                "open",
                () => {

                    setStatus(
                        "顔データ接続完了"
                    );

                }
            );


            dataConnection.on(
                "data",
                data => {

                    sendToPython(
                        data
                    );

                    showFaceData(
                        data
                    );

                }
            );


            dataConnection.on(
                "error",
                error => {

                    console.error(
                        "DataConnection error",
                        error
                    );

                }
            );


            // ------------------------------------------------
            // Video Call
            // ------------------------------------------------

            setStatus(
                "iPadカメラへ接続中..."
            );

            mediaCall =
                peer.call(
                    target,
                    new MediaStream()
                );


            mediaCall.on(
                "stream",
                remoteStream => {

                    console.log(
                        "Remote camera stream"
                    );

                    video.srcObject =
                        remoteStream;

                    video.play();

                    setStatus(
                        "iPadカメラ接続完了\n" +
                        "顔トラッキング受信中"
                    );

                }
            );


            mediaCall.on(
                "error",
                error => {

                    console.error(
                        error
                    );

                    setStatus(
                        "Video接続エラー:\n" +
                        error.message
                    );

                }
            );

        }
    );


    peer.on(
        "error",
        error => {

            console.error(
                error
            );

            setStatus(
                "PeerJS ERROR:\n" +
                error.type +
                "\n" +
                error.message
            );

        }
    );

}


// ============================================================
// Python WebSocket
// ============================================================

let pythonSocket = null;

let pythonConnected = false;


function connectPython() {

    if (pythonSocket) {

        try {
            pythonSocket.close();
        } catch {}

    }


    console.log(
        "Python WebSocket接続..."
    );


    try {

        pythonSocket =
            new WebSocket(
                "ws://127.0.0.1:8765"
            );

    } catch (error) {

        console.error(
            error
        );

        return;

    }


    pythonSocket.onopen =
        () => {

            pythonConnected =
                true;

            console.log(
                "Python WebSocket connected"
            );

            setStatus(
                "Python接続OK\n" +
                "顔データ送信中"
            );

        };


    pythonSocket.onclose =
        () => {

            pythonConnected =
                false;

            console.log(
                "Python WebSocket disconnected"
            );

            setTimeout(
                connectPython,
                1000
            );

        };


    pythonSocket.onerror =
        error => {

            console.error(
                "Python WS error",
                error
            );

        };

}


// ============================================================
// Pythonへ顔データ送信
// ============================================================

function sendToPython(data) {

    if (!pythonSocket) {
        return;
    }

    if (
        pythonSocket.readyState !==
        WebSocket.OPEN
    ) {

        return;

    }

    try {

        pythonSocket.send(
            JSON.stringify(data)
        );

    } catch (error) {

        console.error(
            "Python send error",
            error
        );

    }

}


// ============================================================
// Face data display
// ============================================================

function showFaceData(data) {

    faceInfo.textContent =
        "X "
        + Number(data.x).toFixed(2)

        + "  Y "
        + Number(data.y).toFixed(2)

        + "  Yaw "
        + Number(data.yaw).toFixed(2)

        + "  Pitch "
        + Number(data.pitch).toFixed(2)

        + "  Roll "
        + Number(data.roll).toFixed(2);

}


// ============================================================
// Utility
// ============================================================

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


// ============================================================
// Face Tracking
// ============================================================

function processFace(timestamp) {

    requestAnimationFrame(
        processFace
    );


    if (!faceReady) {
        return;
    }

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return;

    }


    // 同じフレームを何度も処理しない
    if (
        video.currentTime ===
        lastVideoTime
    ) {

        return;

    }

    lastVideoTime =
        video.currentTime;


    // --------------------------------------------------------
    // MediaPipe
    // --------------------------------------------------------

    let result;

    try {

        result =
            faceLandmarker.detectForVideo(
                video,
                timestamp
            );

    } catch (error) {

        console.error(
            "FaceLandmarker error",
            error
        );

        return;

    }


    if (
        !result ||
        !result.faceLandmarks ||
        result.faceLandmarks.length === 0
    ) {

        return;

    }


    const landmarks =
        result.faceLandmarks[0];


    // --------------------------------------------------------
    // Landmark
    //
    // 1   = nose
    // 10  = forehead
    // 33  = left eye
    // 152 = chin
    // 263 = right eye
    // --------------------------------------------------------

    const nose =
        landmarks[1];

    const forehead =
        landmarks[10];

    const leftEye =
        landmarks[33];

    const chin =
        landmarks[152];

    const rightEye =
        landmarks[263];


    // --------------------------------------------------------
    // 顔中心
    // --------------------------------------------------------

    const eyeCenterX =
        (
            leftEye.x +
            rightEye.x
        ) / 2;

    const eyeCenterY =
        (
            leftEye.y +
            rightEye.y
        ) / 2;


    // --------------------------------------------------------
    // 顔の位置
    //
    // 0.5 = 画面中央
    // --------------------------------------------------------

    let x =
        (eyeCenterX - 0.5) * 2;

    let y =
        (eyeCenterY - 0.5) * 2;


    // --------------------------------------------------------
    // Selfie mirror
    // --------------------------------------------------------

    if (MIRROR_FACE_X) {

        x = -x;

    }


    x =
        clamp(
            x,
            -1,
            1
        );

    y =
        clamp(
            y,
            -1,
            1
        );


    // --------------------------------------------------------
    // 顔の大きさ
    // --------------------------------------------------------

    const faceHeight =
        Math.abs(
            chin.y -
            forehead.y
        );

    let scale =
        faceHeight / 0.35;

    scale =
        clamp(
            scale,
            0.5,
            1.8
        );


    // --------------------------------------------------------
    // Yaw
    //
    // 鼻が左右どちらへズレているか
    // --------------------------------------------------------

    const eyeDistance =
        Math.abs(
            rightEye.x -
            leftEye.x
        );


    let yaw = 0;

    if (
        eyeDistance >
        0.0001
    ) {

        yaw =
            (
                nose.x -
                eyeCenterX
            )
            /
            eyeDistance;

        yaw *= 2.0;

    }


    yaw =
        clamp(
            yaw,
            -1,
            1
        );


    // --------------------------------------------------------
    // Pitch
    // --------------------------------------------------------

    const faceHeight2 =
        Math.abs(
            chin.y -
            forehead.y
        );

    let pitch = 0;

    if (
        faceHeight2 >
        0.0001
    ) {

        pitch =
            (
                nose.y -
                eyeCenterY
            )
            /
            faceHeight2;

        pitch -= 0.10;

        pitch *= 4.0;

    }


    pitch =
        clamp(
            pitch,
            -1,
            1
        );


    // --------------------------------------------------------
    // Roll
    //
    // 両目を結んだ線の角度
    // --------------------------------------------------------

    let roll =
        Math.atan2(
            rightEye.y -
            leftEye.y,

            rightEye.x -
            leftEye.x
        );

    roll =
        roll /
        Math.PI;


    roll =
        clamp(
            roll,
            -1,
            1
        );


    // --------------------------------------------------------
    // 送信
    // --------------------------------------------------------

    const now =
        performance.now();


    if (
        now -
        lastSendTime <
        SEND_INTERVAL
    ) {

        return;

    }


    lastSendTime =
        now;


    const data = {

        type: "face",

        x: x,

        y: y,

        yaw: yaw,

        pitch: pitch,

        roll: roll,

        scale: scale,

        time: now

    };


    if (
        dataConnection &&
        dataConnection.open
    ) {

        try {

            dataConnection.send(
                data
            );

        } catch (error) {

            console.error(
                "Face send error",
                error
            );

        }

    }

}


// ============================================================
// Start button
// ============================================================

startButton.addEventListener(
    "click",
    async () => {

        const pin =
            getPin();

        if (!pin) {
            return;
        }


        // ----------------------------------------------------
        // 最初にPythonへ接続
        // ----------------------------------------------------

        connectPython();


        // ----------------------------------------------------
        // デバイス選択
        //
        // iPadならiPad
        // WindowsならWindows
        // ----------------------------------------------------

        const isIOS =
            /iPad|iPhone|iPod/i.test(
                navigator.userAgent
            )
            ||
            (
                navigator.platform ===
                "MacIntel"
                &&
                navigator.maxTouchPoints >
                1
            );


        try {

            if (isIOS) {

                await startIPad(
                    pin
                );

            } else {

                await startWindows(
                    pin
                );

            }

        } catch (error) {

            console.error(
                error
            );

            setStatus(
                "ERROR:\n" +
                error.message
            );

        }

    }
);

</script>

</body>

</html>
