<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPad ジェスチャーズーム ＆ リアルタイム配信</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* カメラ・描画用ステージ */
    #stage {
      position: relative;
      width: 800px;
      height: 600px;
      max-width: 95vw;
      max-height: 70vh;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    #zoom-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 鏡合わせ表示 */
    }

    /* UIパネル */
    #control-panel {
      margin-top: 15px;
      background: rgba(22, 27, 34, 0.9);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid #30363d;
      text-align: center;
      z-index: 20;
    }

    input, button {
      padding: 8px 12px;
      font-size: 15px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    input { background: #161b22; color: #fff; width: 120px; text-align: center; }
    button { background: #238636; color: white; cursor: pointer; border: none; font-weight: bold; }
    button:hover { background: #2ea043; }
    .status { margin-bottom: 6px; font-weight: bold; color: #58a6ff; font-size: 14px; }
    .zoom-info { font-size: 16px; color: #f2e05a; font-weight: bold; margin-top: 4px; }
  </style>

  <!-- MediaPipe Hands ＆ PeerJS -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>👌 手のジェスチャーズーム ビューワー</h2>

  <div id="stage">
    <div id="zoom-wrapper">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="output-canvas"></canvas>
    </div>
  </div>

  <div id="control-panel">
    <div id="status" class="status">通信初期化中...</div>
    <div class="zoom-info">現在の倍率: <span id="zoom-val">1.00</span>x</div>
    <div id="connection-ui" style="margin-top: 8px;">
      ID: <span id="my-id" style="color: #f2e05a; font-weight: bold;">----</span>
      <input type="text" id="target-id" placeholder="相手のID">
      <button onclick="connectToPeer()">iPadから接続</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const zoomWrapper = document.getElementById('zoom-wrapper');
    const zoomValSpan = document.getElementById('zoom-val');
    const statusText = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');

    let peer = null;
    let dataConnection = null;
    let currentScale = 1.0;

    // --- PeerJS (WebRTC通信) ---
    const customId = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer(customId);

    peer.on('open', (id) => {
      myIdSpan.innerText = id;
      statusText.innerText = "Windows側はこのIDをiPadに入力して待機してください";
    });

    peer.on('connection', (conn) => {
      dataConnection = conn;
      setupDataReceiver();
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        videoElement.srcObject = remoteStream;
        statusText.innerText = "iPadからの映像を受信中！手でピンチ操作できます";
      });
    });

    function connectToPeer() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert("接続先のIDを入力してください");

      statusText.innerText = "接続中...";
      dataConnection = peer.connect(targetId);
      dataConnection.on('open', () => {
        statusText.innerText = "接続成功！手認識トラッキングを開始します";
        initHandTracking(true, targetId);
      });
    }

    // Windows側（データ受信）：iPadから送られたズーム倍率を画面に反映
    function setupDataReceiver() {
      dataConnection.on('data', (data) => {
        if (data.type === 'zoom') {
          updateZoom(data.scale);
        }
      });
    }

    function updateZoom(scale) {
      currentScale = Math.max(0.5, Math.min(3.0, scale)); // 0.5倍〜3.0倍に制限
      zoomWrapper.style.transform = `scale(${currentScale})`;
      zoomValSpan.innerText = currentScale.toFixed(2);
    }

    // --- MediaPipe Hands (手の認識 ＆ ジェスチャーズーム) ---
    function initHandTracking(isCameraOwner, targetId = null) {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        canvasElement.width = videoElement.videoWidth || 800;
        canvasElement.height = videoElement.videoHeight || 600;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];

          // 親指の先 (4) と 人差し指の先 (8) の座標を取得
          const thumbTip = landmarks[4];
          const indexTip = landmarks[8];

          const w = canvasElement.width;
          const h = canvasElement.height;

          const p1 = { x: thumbTip.x * w, y: thumbTip.y * h };
          const p2 = { x: indexTip.x * w, y: indexTip.y * h };

          // 2点間のピクセル距離を計算
          const distance = Math.hypot(p2.x - p1.x, p2.y - p1.y);

          // 指間の距離（標準約50〜250px）をズーム倍率 (0.5x〜2.5x) にマッピング
          const newScale = 0.5 + (distance / 120);
          updateZoom(newScale);

          // Windows側へズーム情報を送信
          if (dataConnection && dataConnection.open) {
            dataConnection.send({
              type: 'zoom',
              scale: newScale
            });
          }

          // 1. 指先を結ぶ直線を描画
          canvasCtx.beginPath();
          canvasCtx.moveTo(p1.x, p1.y);
          canvasCtx.lineTo(p2.x, p2.y);
          canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          canvasCtx.lineWidth = 3;
          canvasCtx.stroke();

          // 2. 指先にインジケーター（丸）を描画
          drawCircle(p1.x, p1.y, 8, '#ff0055'); // 親指: 赤
          drawCircle(p2.x, p2.y, 8, '#00aaff'); // 人差し指: 青

          statusText.innerText = "手検出中！指を開閉してズームイン・ズームアウト";
        } else {
          statusText.innerText = "カメラに手をかざしてください";
        }
        canvasCtx.restore();
      });

      if (isCameraOwner) {
        const camera = new Camera(videoElement, {
          onFrame: async () => {
            await faceMeshOrHandsFrame(hands);
          },
          width: 640,
          height: 480,
          facingMode: 'user'
        });

        camera.start().then(() => {
          const stream = videoElement.srcObject;
          peer.call(targetId, stream);
          statusText.innerText = "配信中！カメラに手を向けて操作してください。";
        });
      }
    }

    async function faceMeshOrHandsFrame(hands) {
      if (videoElement.readyState >= 2) {
        await hands.send({ image: videoElement });
      }
    }

    function drawCircle(x, y, r, color) {
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, r, 0, 2 * Math.PI);
      canvasCtx.fillStyle = color;
      canvasCtx.fill();
      canvasCtx.strokeStyle = '#ffffff';
      canvasCtx.lineWidth = 2;
      canvasCtx.stroke();
    }
  </script>
</body>
</html>
