<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPad リアルタイム 3D Face Mesh</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #stage {
      position: relative;
      width: 800px;
      height: 600px;
      max-width: 95vw;
      max-height: 75vh;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 鏡合わせ */
    }

    #control-panel {
      margin-top: 15px;
      background: rgba(22, 27, 34, 0.9);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid #30363d;
      text-align: center;
      z-index: 20;
    }

    input, button {
      padding: 8px 12px;
      font-size: 15px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    input { background: #161b22; color: #fff; width: 120px; text-align: center; }
    button { background: #238636; color: white; cursor: pointer; border: none; font-weight: bold; }
    button:hover { background: #2ea043; }
    .status { margin-bottom: 6px; font-weight: bold; color: #58a6ff; font-size: 14px; }
  </style>

  <!-- MediaPipe Face Mesh & PeerJS -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>🎭 リアルタイム 3D Face Mesh ビューワー</h2>

  <div id="stage">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div id="control-panel">
    <div id="status" class="status">通信初期化中...</div>
    <div id="connection-ui">
      ID: <span id="my-id" style="color: #f2e05a; font-weight: bold;">----</span>
      <input type="text" id="target-id" placeholder="相手のID">
      <button onclick="connectToPeer()">iPadから接続</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');

    let peer = null;
    let dataConnection = null;

    // --- PeerJS (通信基盤) ---
    const customId = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer(customId);

    peer.on('open', (id) => {
      myIdSpan.innerText = id;
      statusText.innerText = "Windows側はこのIDをiPadに入力して待機してください";
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        videoElement.srcObject = remoteStream;
        statusText.innerText = "iPadからのリアルタイム映像を受信中！";
        initFaceMesh(false);
      });
    });

    function connectToPeer() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert("接続先のIDを入力してください");

      statusText.innerText = "接続中...";
      dataConnection = peer.connect(targetId);
      dataConnection.on('open', () => {
        statusText.innerText = "接続成功！カメラとFace Meshを開始します";
        initFaceMesh(true, targetId);
      });
    }

    // --- Face Mesh ＆ メッシュ自前描画 ---
    function initFaceMesh(isCameraOwner, targetId = null) {
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults((results) => {
        canvasElement.width = videoElement.videoWidth || 800;
        canvasElement.height = videoElement.videoHeight || 600;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const landmarks = results.multiFaceLandmarks[0];
          
          // 1. メッシュ（顔全体を繋ぐ三角形・ライン）を描画
          drawCustomMesh(landmarks);
          
          // 2. ランドマークの全頂点に小さなドットを描画
          drawLandmarkDots(landmarks);

          statusText.innerText = `メッシュ描画中！ (${landmarks.length} 頂点検出)`;
        } else {
          statusText.innerText = "顔をカメラに向けてください";
        }
        canvasCtx.restore();
      });

      if (isCameraOwner) {
        const camera = new Camera(videoElement, {
          onFrame: async () => {
            await faceMesh.send({ image: videoElement });
          },
          width: 640,
          height: 480,
          facingMode: 'user'
        });

        camera.start().then(() => {
          const stream = videoElement.srcObject;
          peer.call(targetId, stream);
          statusText.innerText = "iPadからFace Mesh付き映像を配信中！";
        });
      } else {
        async function renderFrame() {
          if (videoElement.currentTime > 0 && !videoElement.paused && !videoElement.ended) {
            await faceMesh.send({ image: videoElement });
          }
          requestAnimationFrame(renderFrame);
        }
        videoElement.addEventListener('play', () => {
          renderFrame();
        });
      }
    }

    // 顔のランドマーク同士を結んで自前で3D網目（メッシュ）を描く処理
    function drawCustomMesh(landmarks) {
      const w = canvasElement.width;
      const h = canvasElement.height;

      // 描画スタイルの設定（サイバーグリーン）
      canvasCtx.strokeStyle = 'rgba(0, 255, 170, 0.45)';
      canvasCtx.lineWidth = 0.8;

      // 定義されているFACEMESH接続リストが取得できればそれを使い、
      // なければ近接点同士を結んで確実にメッシュ化する
      const connections = window.FACEMESH_TESSELATION || getFallbackConnections();

      canvasCtx.beginPath();
      for (const conn of connections) {
        const p1 = landmarks[conn[0]];
        const p2 = landmarks[conn[1]];
        if (p1 && p2) {
          canvasCtx.moveTo(p1.x * w, p1.y * h);
          canvasCtx.lineTo(p2.x * w, p2.y * h);
        }
      }
      canvasCtx.stroke();
    }

    // ランドマークのポイントにネオン点滅ドットを描く
    function drawLandmarkDots(landmarks) {
      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.fillStyle = '#00ffaa';
      for (let i = 0; i < landmarks.length; i += 3) { // 軽快に動くよう間引き描画
        const p = landmarks[i];
        canvasCtx.beginPath();
        canvasCtx.arc(p.x * w, p.y * h, 1.2, 0, 2 * Math.PI);
        canvasCtx.fill();
      }
    }

    // 万が一ライブラリ内部の接続定義が読めない場合のバックアップメッシュ構造
    function getFallbackConnections() {
      const links = [];
      for (let i = 0; i < 468; i += 2) {
        links.push([i, (i + 1) % 468]);
        links.push([i, (i + 4) % 468]);
      }
      return links;
    }
  </script>
</body>
</html>
