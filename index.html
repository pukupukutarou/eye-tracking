<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPad 視線追跡 ＆ WebRTC ストリーミング</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #video-container {
      position: relative;
      width: 640px;
      height: 480px;
      max-width: 95vw;
      max-height: 70vh;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* 鏡合わせ */
    }

    /* 視線ポイント（受け取り側・送信側共通） */
    #gaze-dot {
      position: absolute;
      width: 24px;
      height: 24px;
      background-color: rgba(255, 0, 85, 0.8);
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px #ff0055;
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    #control-panel {
      margin-top: 15px;
      background: rgba(22, 27, 34, 0.9);
      padding: 15px 20px;
      border-radius: 10px;
      border: 1px solid #30363d;
      text-align: center;
      max-width: 90vw;
    }

    input, button {
      padding: 8px 12px;
      font-size: 16px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    input { background: #161b22; color: #fff; width: 140px; text-align: center; }
    button { background: #238636; color: white; cursor: pointer; border: none; }
    button:hover { background: #2ea043; }
    .status { margin-bottom: 8px; font-weight: bold; color: #58a6ff; }
  </style>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <!-- PeerJS (WebRTC通信用) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>👀 iPad 視線追跡 ライブビューワー</h2>

  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output-canvas"></canvas>
    <div id="gaze-dot"></div>
  </div>

  <div id="control-panel">
    <div id="status" class="status">通信初期化中...</div>
    
    <!-- モード切り替え・接続設定UI -->
    <div id="connection-ui">
      <div>あなたのID: <span id="my-id" style="color: #f2e05a; font-weight: bold;">----</span></div>
      <div style="margin-top: 10px;">
        <input type="text" id="target-id" placeholder="相手のIDを入力">
        <button onclick="connectToPeer()">iPadからWindowsに接続</button>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const gazeDot = document.getElementById('gaze-dot');
    const statusText = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');

    let peer = null;
    let dataConnection = null;
    let mediaCall = null;
    let isSender = false; // iPad側かどうかのフラグ

    // --- 1. PeerJS（WebRTC通信）の初期化 ---
    // ランダムな4桁風のIDを生成
    const customId = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer(customId);

    peer.on('open', (id) => {
      myIdSpan.innerText = id;
      statusText.innerText = "準備完了。Windowsで開いている場合はこのIDをiPadに入力してください。";
    });

    // 受信側（Windows）の処理：接続要求を受ける
    peer.on('connection', (conn) => {
      dataConnection = conn;
      setupDataReceiver();
    });

    peer.on('call', (call) => {
      // iPadからの映像ストリームを受信
      call.answer();
      call.on('stream', (remoteStream) => {
        videoElement.srcObject = remoteStream;
        statusText.innerText = "iPadからのリアルタイム映像・視線データを受信中！";
      });
    });

    // 送信側（iPad）の処理：IDを指定して接続
    function connectToPeer() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert("接続先のIDを入力してください");

      statusText.innerText = "接続中...";
      
      // データ通信の接続
      dataConnection = peer.connect(targetId);
      dataConnection.on('open', () => {
        statusText.innerText = "Windowsとの接続成功！カメラを開始します...";
        isSender = true;
        startCameraAndTracking(targetId);
      });
    }

    function setupDataReceiver() {
      dataConnection.on('data', (data) => {
        // Windows側で視線座標(X, Y)を受け取って赤点を動かす
        if (data.type === 'gaze') {
          gazeDot.style.display = 'block';
          gazeDot.style.left = (data.x * 100) + '%';
          gazeDot.style.top = (data.y * 100) + '%';
        }
      });
    }

    // --- 2. iPad側のカメラ ＆ MediaPipe処理 ---
    function startCameraAndTracking(targetId) {
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults((results) => {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const landmarks = results.multiFaceLandmarks[0];
          const leftIris = landmarks[468];
          const rightIris = landmarks[473];

          // 黒目の中心（相対座標 0.0 ~ 1.0）
          const irisX = (leftIris.x + rightIris.x) / 2;
          const irisY = (leftIris.y + rightIris.y) / 2;

          // 自分の画面に描画
          gazeDot.style.display = 'block';
          gazeDot.style.left = ((1.0 - irisX) * 100) + '%';
          gazeDot.style.top = (irisY * 100) + '%';

          // Windows側へリアルタイム視線データを送信
          if (dataConnection && dataConnection.open) {
            dataConnection.send({
              type: 'gaze',
              x: 1.0 - irisX, // 鏡合わせ補正
              y: irisY
            });
          }
        }
      });

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
        },
        width: 640,
        height: 480,
        facingMode: 'user'
      });

      camera.start().then(() => {
        // カメラ映像ストリームをWindows側に送信
        const stream = videoElement.srcObject;
        peer.call(targetId, stream);
        statusText.innerText = "配信中！iPadのカメラ映像と視線をWindowsに共有しています。";
      });
    }
  </script>
</body>
</html>
