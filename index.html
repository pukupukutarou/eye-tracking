<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Simple WebRTC Webcam Streamer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f0f6fc;
    }

    #stage {
      position: relative;
      width: 800px;
      height: 600px;
      max-width: 95vw;
      max-height: 70vh;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Front camera mirror effect */
    }

    #control-panel {
      margin-top: 16px;
      background: rgba(22, 27, 34, 0.95);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid #30363d;
      text-align: center;
      width: 95vw;
      max-width: 480px;
      backdrop-filter: blur(8px);
    }

    .status {
      margin-bottom: 12px;
      font-weight: 500;
      color: #58a6ff;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    .connection-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .id-display {
      font-size: 0.95rem;
      color: #8b949e;
    }

    .id-value {
      color: #f2e05a;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      margin-left: 4px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }

    input[type="text"] {
      padding: 8px 12px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #f0f6fc;
      outline: none;
      width: 140px;
      text-align: center;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #58a6ff;
    }

    button {
      padding: 8px 16px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: none;
      background: #238636;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #2ea043;
    }

    button:disabled {
      background: #21262d;
      color: #484f58;
      cursor: not-allowed;
    }
  </style>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>📷 WebRTC カメラストリーミング</h2>

  <div id="stage">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div id="control-panel">
    <div id="status" class="status">PeerJS 初期化中...</div>
    <div class="connection-group">
      <div class="id-display">あなたのID: <span id="my-id" class="id-value">----</span></div>
      <div class="input-row">
        <input type="text" id="target-id" placeholder="相手の4桁ID" maxlength="4" pattern="[0-9]*" inputmode="numeric">
        <button id="connect-btn" onclick="connectToPeer()">接続 & 配信</button>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');
    const connectBtn = document.getElementById('connect-btn');
    const targetIdInput = document.getElementById('target-id');

    let peer = null;
    let localStream = null;

    // Generate random 4-digit ID
    const randomId = Math.floor(1000 + Math.random() * 9000).toString();

    peer = new Peer(randomId);

    peer.on('open', (id) => {
      myIdSpan.innerText = id;
      statusText.innerText = "準備完了。iPad側のIDをWindowsに入力、または送信してください。";
    });

    // Receiver handling (e.g., Windows PC waiting for iPad stream)
    peer.on('call', (call) => {
      statusText.innerText = "着信中... 接続を完了しています";
      call.answer(); // Answer incoming stream without sending local video back
      
      call.on('stream', (remoteStream) => {
        videoElement.srcObject = remoteStream;
        videoElement.muted = false;
        statusText.innerText = "リアルタイム映像を受信中！";
      });
    });

    peer.on('error', (err) => {
      console.error('PeerJS error:', err);
      statusText.innerText = `エラーが発生しました: ${err.type}`;
    });

    async function connectToPeer() {
      const targetId = targetIdInput.value.trim();
      if (!targetId) {
        alert("接続先の4桁IDを入力してください。");
        return;
      }

      statusText.innerText = "カメラアクセスを取得中...";
      connectBtn.disabled = true;

      try {
        // Request front camera media stream
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        // Display local stream on iPad
        videoElement.srcObject = localStream;

        statusText.innerText = "相手に接続中...";
        const call = peer.call(targetId, localStream);

        call.on('close', () => {
          statusText.innerText = "通信が切断されました";
          connectBtn.disabled = false;
        });

        statusText.innerText = "配信中！カメラ映像を送信しています。";
      } catch (err) {
        console.error("Camera access error:", err);
        statusText.innerText = "カメラの起動に失敗しました。アクセス権限を確認してください。";
        connectBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
