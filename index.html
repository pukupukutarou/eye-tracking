<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTuber Single Page App</title>
  
  <!-- PeerJS (WebRTC通信) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- MediaPipe FaceMesh (iPad用トラッキング) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* ---------------- PC表示（デフォルト） ---------------- */
    body.pc-mode {
      background-color: #00ff00; /* クロマキー用グリーン */
      display: flex; justify-content: center; align-items: center;
    }

    #info-panel {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.8); color: white;
      padding: 12px 16px; border-radius: 8px; font-size: 14px;
      z-index: 100;
    }
    #my-id { font-weight: bold; color: #a6e3a1; font-size: 18px; user-select: all; }

    #avatar-container { width: 400px; height: 400px; }
    #avatar-svg { width: 100%; height: 100%; }

    /* ---------------- iPad表示 ---------------- */
    body.ipad-mode {
      background-color: #1e1e2e;
      color: #cdd6f4;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }

    .ipad-ui { display: none; }
    body.ipad-mode .ipad-ui { display: flex; flex-direction: column; align-items: center; }
    body.ipad-mode #avatar-container,
    body.ipad-mode #info-panel { display: none; }

    #status { font-size: 18px; margin-bottom: 20px; font-weight: bold; }
    input {
      padding: 12px; font-size: 18px; border-radius: 8px;
      border: 1px solid #45475a; width: 220px; text-align: center; margin-bottom: 15px;
    }
    button {
      padding: 12px 24px; font-size: 18px; border-radius: 8px;
      border: none; background: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer;
    }

    video { display: none; } /* カメラ映像は完全非表示 */
  </style>
</head>
<body class="pc-mode">

  <!-- PC画面用: ID案内パネル -->
  <div id="info-panel">
    接続ID: <span id="my-id">発行中...</span><br>
    <small>※iPadでこのページの末尾に <b>?role=ipad</b> を付けて開き、上記IDを入力してください</small>
  </div>

  <!-- PC画面用: アバターSVG -->
  <div id="avatar-container">
    <svg viewBox="0 0 200 200" id="avatar-svg">
      <!-- 髪（後） -->
      <path d="M 40,100 Q 100,20 160,100 L 170,160 L 30,160 Z" fill="#6c5ce7" />
      <!-- 顔 -->
      <path d="M 50,70 Q 100,160 150,70 Q 150,40 100,35 Q 50,40 50,70 Z" fill="#ffeaa7" />
      <!-- 前髪 -->
      <path d="M 45,65 Q 100,85 155,65 Q 140,30 100,30 Q 60,30 45,65 Z" fill="#a29bfe" />

      <!-- 左目 -->
      <g id="left-eye">
        <ellipse cx="75" cy="80" rx="10" ry="12" fill="#2d3436" />
        <ellipse cx="75" cy="80" rx="4" ry="5" fill="#00cec9" />
        <circle cx="72" cy="76" r="2.5" fill="#ffffff" />
      </g>

      <!-- 右目 -->
      <g id="right-eye">
        <ellipse cx="125" cy="80" rx="10" ry="12" fill="#2d3436" />
        <ellipse cx="125" cy="80" rx="4" ry="5" fill="#00cec9" />
        <circle cx="122" cy="76" r="2.5" fill="#ffffff" />
      </g>

      <!-- 口 -->
      <path id="mouth" d="M 85,118 Q 100,121 115,118 Q 100,117 85,118 Z" fill="#ff7675" stroke="#d63031" stroke-width="1.5" />
    </svg>
  </div>

  <!-- iPad画面用 UI -->
  <div class="ipad-ui">
    <div id="status">初期化中...</div>
    <input type="text" id="pc-id" placeholder="PC側のIDを入力">
    <button id="connect-btn">PCに接続して配信開始</button>
  </div>

  <!-- カメラ要素（非表示） -->
  <video id="webcam" playsinline muted></video>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isIpad = urlParams.get('role') === 'ipad';

    // 距離計算関数
    function distance(p1, p2) {
      return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
    }

    if (isIpad) {
      // ---------------- 【 iPad 側の処理 】 ----------------
      document.body.className = 'ipad-mode';

      const statusEl = document.getElementById('status');
      const pcIdInput = document.getElementById('pc-id');
      const connectBtn = document.getElementById('connect-btn');
      const videoElement = document.getElementById('webcam');

      const peer = new Peer();
      let conn = null;

      peer.on('open', () => {
        statusEl.innerText = "準備完了：PC画面のIDを入力してください";
      });

      connectBtn.addEventListener('click', () => {
        const targetId = pcIdInput.value.trim();
        if (!targetId) return alert('PC側のIDを入力してください');

        statusEl.innerText = "接続中...";
        conn = peer.connect(targetId);

        conn.on('open', () => {
          statusEl.innerText = "PCに接続しました！カメラの表情を送信中...";
          startCameraTracking();
        });

        conn.on('close', () => {
          statusEl.innerText = "切断されました。再読み込みしてください。";
        });
      });

      function startCameraTracking() {
        const faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });

        faceMesh.onResults((results) => {
          if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0 || !conn || !conn.open) return;

          const landmarks = results.multiFaceLandmarks[0];

          // 口の計算
          const mouthHeight = distance(landmarks[13], landmarks[14]);
          const mouthWidth = distance(landmarks[61], landmarks[291]);
          const mouthRatio = mouthHeight / mouthWidth;

          // 目の計算
          const leftEAR = distance(landmarks[159], landmarks[145]) / distance(landmarks[33], landmarks[133]);
          const rightEAR = distance(landmarks[386], landmarks[374]) / distance(landmarks[362], landmarks[263]);

          // 数値データのみを送信（映像は送らない）
          conn.send({
            mouthRatio: mouthRatio,
            leftEyeClosed: leftEAR < 0.18,
            rightEyeClosed: rightEAR < 0.18
          });
        });

        const camera = new Camera(videoElement, {
          onFrame: async () => { await faceMesh.send({ image: videoElement }); },
          width: 640, height: 480
        });
        camera.start().catch(err => {
          statusEl.innerText = "カメラ起動エラー: " + err.message;
        });
      }

    } else {
      // ---------------- 【 PC 側の処理 】 ----------------
      document.body.className = 'pc-mode';

      const myIdEl = document.getElementById('my-id');
      const mouthPath = document.getElementById('mouth');
      const leftEye = document.getElementById('left-eye');
      const rightEye = document.getElementById('right-eye');

      const peer = new Peer();

      peer.on('open', (id) => {
        myIdEl.innerText = id;
      });

      peer.on('connection', (conn) => {
        myIdEl.innerText = "iPadと接続完了！";

        conn.on('data', (data) => {
          // 口の変形
          if (data.mouthRatio > 0.35) {
            mouthPath.setAttribute('d', 'M 85,115 Q 100,140 115,115 Q 100,100 85,115 Z');
          } else if (data.mouthRatio > 0.18) {
            mouthPath.setAttribute('d', 'M 85,115 Q 100,128 115,115 Q 100,110 85,115 Z');
          } else {
            mouthPath.setAttribute('d', 'M 85,118 Q 100,121 115,118 Q 100,117 85,118 Z');
          }

          // 目のまばたき
          leftEye.style.transform = data.leftEyeClosed ? 'scaleY(0.1)' : 'scaleY(1)';
          leftEye.style.transformOrigin = '75px 80px';

          rightEye.style.transform = data.rightEyeClosed ? 'scaleY(0.1)' : 'scaleY(1)';
          rightEye.style.transformOrigin = '125px 80px';
        });
      });
    }
  </script>
</body>
</html>
