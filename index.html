<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPad 視線追跡 ライブビューワー</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* カメラ映像（小窓表示） */
    #video-container {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 200px;
      height: 150px;
      border: 2px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      z-index: 10;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    /* 画面上の視線ポインタ（青い丸） */
    #gaze-pointer {
      position: absolute;
      width: 36px;
      height: 36px;
      background-color: rgba(0, 170, 255, 0.85);
      border: 3px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px #00aaff;
      pointer-events: none;
      z-index: 100;
      display: none;
      transition: left 0.1s ease-out, top 0.1s ease-out;
    }

    /* 中央コントロールパネル */
    #control-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.9);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid #30363d;
      text-align: center;
      z-index: 20;
    }

    input, button {
      padding: 8px 12px;
      font-size: 15px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    input { background: #161b22; color: #fff; width: 120px; text-align: center; }
    button { background: #238636; color: white; cursor: pointer; border: none; font-weight: bold; }
    .status { margin-bottom: 6px; font-weight: bold; color: #58a6ff; font-size: 14px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- 画面上のどこを見ているかを示すポインタ -->
  <div id="gaze-pointer"></div>

  <!-- 右上の小窓カメラ -->
  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div id="control-panel">
    <div id="status" class="status">通信初期化中...</div>
    <div id="connection-ui">
      ID: <span id="my-id" style="color: #f2e05a; font-weight: bold;">----</span>
      <input type="text" id="target-id" placeholder="相手のID">
      <button onclick="connectToPeer()">iPadから接続</button>
      <button onclick="resetCenter()" style="background: #d29922; margin-left: 10px;">正面リセット</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const gazePointer = document.getElementById('gaze-pointer');
    const statusText = document.getElementById('status');
    const myIdSpan = document.getElementById('my-id');

    let peer = null;
    let dataConnection = null;
    
    // 基準となる正面視線位置（自動調整用）
    let baseIrisOffsetX = 0;
    let baseIrisOffsetY = 0;
    // 目の動きを画面上に広げる感度倍率
    const SENSITIVITY_X = 15.0; 
    const SENSITIVITY_Y = 12.0;

    // --- PeerJS（通信） ---
    const customId = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer(customId);

    peer.on('open', (id) => {
      myIdSpan.innerText = id;
      statusText.innerText = "Windows側は表示されたIDをiPadに入力してください";
    });

    peer.on('connection', (conn) => {
      dataConnection = conn;
      setupDataReceiver();
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        videoElement.srcObject = remoteStream;
        statusText.innerText = "iPadの視線を追跡中！画面の中央を見て「正面リセット」を押してください";
      });
    });

    function connectToPeer() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert("接続先のIDを入力してください");

      statusText.innerText = "接続中...";
      dataConnection = peer.connect(targetId);
      dataConnection.on('open', () => {
        statusText.innerText = "接続成功！カメラを開始します";
        startCameraAndTracking(targetId);
      });
    }

    // Windows（受信側）：視線座標を受け取り、大きな青丸を移動させる
    function setupDataReceiver() {
      dataConnection.on('data', (data) => {
        if (data.type === 'gaze') {
          gazePointer.style.display = 'block';

          // 基準位置からの相対的なオフセット量を計算
          const deltaX = (data.irisX - baseIrisOffsetX) * SENSITIVITY_X;
          const deltaY = (data.irisY - baseIrisOffsetY) * SENSITIVITY_Y;

          // 画面中央 (50%) からどれだけ離れたかを算出
          let screenX = (0.5 + deltaX) * window.innerWidth;
          let screenY = (0.5 + deltaY) * window.innerHeight;

          // 画面外はみ出し防止
          screenX = Math.max(20, Math.min(window.innerWidth - 20, screenX));
          screenY = Math.max(20, Math.min(window.innerHeight - 20, screenY));

          gazePointer.style.left = screenX + 'px';
          gazePointer.style.top = screenY + 'px';
        }
      });
    }

    function resetCenter() {
      // 現在の目の位置を「正面（画面中央）」として記憶
      baseIrisOffsetX = window.lastRawIrisX || 0;
      baseIrisOffsetY = window.lastRawIrisY || 0;
      statusText.innerText = "正面位置をリセットしました！";
    }

    // --- iPad（送信側）：目の動きベクトルを送信 ---
    function startCameraAndTracking(targetId) {
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true, // 虹彩（黒目）の検出を有効化
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults((results) => {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const landmarks = results.multiFaceLandmarks[0];
          
          // 顔の中心（鼻筋 168）と左右の黒目（468, 473）の相対座標を計算
          const nose = landmarks[168];
          const leftIris = landmarks[468];
          const rightIris = landmarks[473];

          const irisCenterX = (leftIris.x + rightIris.x) / 2;
          const irisCenterY = (leftIris.y + rightIris.y) / 2;

          // 顔の中心から見て黒目がどれくらい動いているか（向き）
          // 鏡合わせのためXの差分符号を反転
          const irisOffsetX = -(irisCenterX - nose.x);
          const irisOffsetY = irisCenterY - nose.y;

          window.lastRawIrisX = irisOffsetX;
          window.lastRawIrisY = irisOffsetY;

          // プレビュー用に目元に小さな赤点を描画
          drawPoint(leftIris);
          drawPoint(rightIris);

          // 相手（Windows）に目の「向きベクトル」を送信
          if (dataConnection && dataConnection.open) {
            dataConnection.send({
              type: 'gaze',
              irisX: irisOffsetX,
              irisY: irisOffsetY
            });
          }
        }
      });

      function drawPoint(point) {
        const x = point.x * canvasElement.width;
        const y = point.y * canvasElement.height;
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 3, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#ff0055';
        canvasCtx.fill();
      }

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
        },
        width: 640,
        height: 480,
        facingMode: 'user'
      });

      camera.start().then(() => {
        const stream = videoElement.srcObject;
        peer.call(targetId, stream);
        statusText.innerText = "配信中！正面を見ながらWindowsの「正面リセット」を押してください。";
      });
    }
  </script>
</body>
</html>
